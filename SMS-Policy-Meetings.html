<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Policy Meetings</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1450px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
}

.header{text-align:center;margin-bottom:42px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

h1{
  font-size:54px;
  color:#003b66;
  font-weight:900;
}

.subtitle{
  color:#536172;
  font-size:19px;
  font-weight:600;
  margin-top:10px;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.summary-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:24px;
  padding:24px;
  border:1px solid #e6eef5;
  border-top:8px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  text-align:center;
}

.summary-card h2{
  color:#003b66;
  font-size:38px;
  font-weight:900;
}

.summary-card p{
  color:#536172;
  font-weight:900;
  margin-top:6px;
}

.section{margin-bottom:34px;}

.section-title{
  background:linear-gradient(135deg,#003b66,#005f99);
  color:white;
  padding:18px 24px;
  border-radius:20px;
  font-size:24px;
  font-weight:900;
  margin-bottom:18px;
  box-shadow:0 12px 26px rgba(0,0,0,.18);
}

.meeting-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:30px;
  padding:30px;
  margin-bottom:32px;
  border:1px solid #e6eef5;
  border-top:10px solid #00aeef;
  box-shadow:0 16px 34px rgba(0,0,0,.13);
}

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  margin-bottom:20px;
  border:1px solid #e6eef5;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.meeting-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.meeting-title{
  font-size:28px;
  color:#003b66;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.full{grid-column:1/3;}

label{
  color:#003b66;
  font-weight:900;
  display:block;
  margin-bottom:7px;
}

select,input,textarea{
  width:100%;
  padding:14px;
  border:1px solid #cfd8e3;
  border-radius:14px;
  font-size:14px;
  background:white;
  font-family:'Segoe UI',Arial,sans-serif;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

select:focus,input:focus,textarea:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
}

.activity-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 130px;
  gap:14px;
  align-items:end;
  margin-bottom:14px;
  padding:16px;
  border-radius:18px;
  background:#f8fcff;
  border:1px solid #e6eef5;
}

.signature-row{
  display:grid;
  grid-template-columns:1fr 1fr 120px;
  gap:14px;
  align-items:end;
  margin-bottom:14px;
  padding:16px;
  border-radius:18px;
  background:#f8fcff;
  border:1px solid #e6eef5;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:35px;
  flex-wrap:wrap;
}

button{
  border:none;
  color:white;
  padding:14px 24px;
  border-radius:16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

button:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.save-btn{background:linear-gradient(135deg,#16a34a,#22c55e);}
.print-btn{background:linear-gradient(135deg,#111827,#374151);}
.reset-btn{background:linear-gradient(135deg,#64748b,#334155);}
.database-btn{background:linear-gradient(135deg,#00aeef,#0284c7);}
.back-btn{background:linear-gradient(135deg,#f59e0b,#d97706);}
.home-btn{background:linear-gradient(135deg,#003b66,#005f99);}
.add-btn{background:linear-gradient(135deg,#00aeef,#0284c7);}
.remove-btn{background:linear-gradient(135deg,#dc2626,#991b1b);}
.close-btn{background:linear-gradient(135deg,#003b66,#005f99);}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:950px){
  body{padding:25px;}
  .container{padding:35px 22px;border-radius:28px;}
  h1{font-size:38px;}
  .grid,.activity-row,.signature-row{grid-template-columns:1fr;}
  .full{grid-column:1;}
}

@media print{
  body{background:white;padding:10px;}
  .buttons,.remove-btn,.add-btn{display:none;}
  .container{box-shadow:none;padding:15px;}
  .meeting-card,.card{break-inside:avoid;}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">📝</div>
  <div class="company-label">AIR ACCESSORIES & AVIONICS</div>
  <h1>SMS Policy Meetings</h1>
  <div class="subtitle">Operational Safety Meeting Minutes • Safety Promotion • 14 CFR Part 5</div>
  <div class="title-line"></div>
</div>

<div class="summary">
  <div class="summary-card">
    <h2 id="meetingCount">1</h2>
    <p>MEETINGS</p>
  </div>
  <div class="summary-card">
    <h2 id="activityCount">1</h2>
    <p>ACTIVITIES</p>
  </div>
  <div class="summary-card">
    <h2>5.93</h2>
    <p>SAFETY COMMUNICATION</p>
  </div>
  <div class="summary-card">
    <h2>SMS</h2>
    <p>MEETING MINUTES</p>
  </div>
</div>

<form id="meetingsForm">

<div id="meetingsContainer"></div>

<div class="buttons">
  <button type="button" class="add-btn" onclick="addMeeting()">➕ Add New Meeting</button>
</div>

<div class="buttons">
  <button type="submit" class="save-btn">💾 Save Meetings</button>
  <button type="button" class="print-btn" onclick="window.print()">🖨️ Print</button>
  <button type="button" class="database-btn" onclick="window.location.href='SMS-Policy-Meetings-Database.html'">📂 Database</button>
  <button type="button" class="reset-btn" onclick="resetForm()">🔄 Reset</button>
  <button type="button" class="back-btn" onclick="window.location.href='SMS-Policy.html'">← Back</button>
  <button type="button" class="home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
</div>

</form>

<div class="footer">
  371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const meetingsPath = "smsPolicyMeetings";

let meetingCounter = 0;

function today(){
  return new Date().toISOString().split("T")[0];
}

function updateCounters(){
  document.getElementById("meetingCount").innerText = document.querySelectorAll(".meeting-card").length;
  document.getElementById("activityCount").innerText = document.querySelectorAll(".activity-row").length;
}

window.addMeeting = function(){
  meetingCounter++;

  const meetingDiv = document.createElement("div");
  meetingDiv.className = "meeting-card";
  meetingDiv.dataset.meeting = meetingCounter;

  meetingDiv.innerHTML = `
    <div class="meeting-head">
      <div class="meeting-title">Meeting ${meetingCounter}</div>
      <button type="button" class="remove-btn" onclick="removeMeeting(this)">🗑 Remove Meeting</button>
    </div>

    <div class="section">
      <div class="section-title">MEETING INFORMATION</div>

      <div class="card">
        <div class="grid">
          <div>
            <label>Meeting Name *</label>
            <input class="meetingName" placeholder="Example: Operational Safety Meeting - Ladder Safety" required>
          </div>

          <div>
            <label>Status</label>
            <select class="meetingStatus">
              <option value="Open">Open</option>
              <option value="Closed">Closed</option>
            </select>
          </div>

          <div>
            <label>Date *</label>
            <input type="date" class="meetingDate" value="${today()}" required>
          </div>

          <div>
            <label>Time</label>
            <input type="time" class="meetingTime">
          </div>

          <div>
            <label>Meeting Leader</label>
            <input class="meetingLeader" placeholder="Meeting leader">
          </div>

          <div>
            <label>Location</label>
            <input class="meetingLocation" placeholder="OPF Hangar / Shop / Office">
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">PENDING TASKS FROM PREVIOUS MEETING</div>

      <div class="card">
        <label>Pending Tasks</label>
        <textarea class="pendingTasks" placeholder="Write pending tasks from the previous meeting."></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">TASKS / ACTIVITIES</div>

      <div class="activitiesContainer"></div>

      <button type="button" class="add-btn" onclick="addActivity(this)">➕ Add Activity</button>
    </div>

    <div class="section">
      <div class="section-title">CONCLUSION</div>

      <div class="card">
        <label>Meeting Conclusion</label>
        <textarea class="meetingConclusion" placeholder="Write the final conclusion, agreements, or next steps."></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">ATTENDEES / SIGNATURES</div>

      <div class="signaturesContainer"></div>

      <button type="button" class="add-btn" onclick="addSignature(this)">➕ Add Signature</button>
    </div>
  `;

  document.getElementById("meetingsContainer").appendChild(meetingDiv);
  addActivity(meetingDiv.querySelector(".add-btn"));
  addSignature(meetingDiv.querySelectorAll(".add-btn")[1]);
  updateCounters();
};

window.addActivity = function(button){
  const meeting = button.closest(".meeting-card");
  const container = meeting.querySelector(".activitiesContainer");

  const activityDiv = document.createElement("div");
  activityDiv.className = "activity-row";

  activityDiv.innerHTML = `
    <div>
      <label>Task / Activity *</label>
      <textarea class="activityText" placeholder="Write activity or task" required></textarea>
    </div>

    <div>
      <label>Responsible</label>
      <input class="activityResponsible" placeholder="Responsible person">
    </div>

    <div>
      <label>Due Date</label>
      <input type="date" class="activityDueDate">
    </div>

    <div>
      <label>Status</label>
      <select class="activityStatus">
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <button type="button" class="remove-btn" onclick="removeActivity(this)">🗑 Remove</button>
  `;

  container.appendChild(activityDiv);
  updateCounters();
};

window.removeActivity = function(button){
  button.closest(".activity-row").remove();
  updateCounters();
};

window.addSignature = function(button){
  const meeting = button.closest(".meeting-card");
  const container = meeting.querySelector(".signaturesContainer");

  const signatureDiv = document.createElement("div");
  signatureDiv.className = "signature-row";

  signatureDiv.innerHTML = `
    <div>
      <label>Name</label>
      <input class="signatureName" placeholder="Attendee name">
    </div>

    <div>
      <label>Signature / Initials</label>
      <input class="signatureValue" placeholder="Signature or initials">
    </div>

    <button type="button" class="remove-btn" onclick="removeSignature(this)">🗑 Remove</button>
  `;

  container.appendChild(signatureDiv);
};

window.removeSignature = function(button){
  button.closest(".signature-row").remove();
};

window.removeMeeting = function(button){
  if(confirm("Do you want to remove this meeting?")){
    button.closest(".meeting-card").remove();
    updateCounters();
  }
};

document.getElementById("meetingsForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const meetings = [];

  document.querySelectorAll(".meeting-card").forEach((meeting,index)=>{
    const activities = [];
    const signatures = [];

    meeting.querySelectorAll(".activity-row").forEach(activity=>{
      activities.push({
        task:activity.querySelector(".activityText").value.trim(),
        responsible:activity.querySelector(".activityResponsible").value.trim(),
        dueDate:activity.querySelector(".activityDueDate").value,
        status:activity.querySelector(".activityStatus").value
      });
    });

    meeting.querySelectorAll(".signature-row").forEach(signature=>{
      signatures.push({
        name:signature.querySelector(".signatureName").value.trim(),
        signature:signature.querySelector(".signatureValue").value.trim()
      });
    });

    meetings.push({
      number:index + 1,
      meetingName:meeting.querySelector(".meetingName").value.trim(),
      status:meeting.querySelector(".meetingStatus").value,
      date:meeting.querySelector(".meetingDate").value,
      time:meeting.querySelector(".meetingTime").value,
      leader:meeting.querySelector(".meetingLeader").value.trim(),
      location:meeting.querySelector(".meetingLocation").value.trim(),
      pendingTasks:meeting.querySelector(".pendingTasks").value.trim(),
      activities:activities,
      conclusion:meeting.querySelector(".meetingConclusion").value.trim(),
      signatures:signatures
    });
  });

  const mainName = meetings[0]?.meetingName || "SMS Policy Meeting";

  const data = {
    recordName:mainName,
    meetings:meetings,
    totalMeetings:meetings.length,
    totalActivities:document.querySelectorAll(".activity-row").length,
    createdAt:Date.now(),
    updatedAt:new Date().toLocaleString()
  };

  try{
    const newRef = push(ref(db, meetingsPath));
    await set(newRef, data);

    alert("SMS Policy Meeting saved successfully.");
  }catch(error){
    alert("Error saving meeting: " + error.message);
  }
});

window.resetForm = function(){
  if(confirm("Do you want to clear all meetings?")){
    document.getElementById("meetingsContainer").innerHTML = "";
    meetingCounter = 0;
    addMeeting();
  }
};

addMeeting();
</script>

</body>
</html>
