<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Meetings</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1450px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
}

.header{text-align:center;margin-bottom:42px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

h1{
  font-size:54px;
  color:#003b66;
  font-weight:900;
}

.subtitle{
  color:#536172;
  font-size:19px;
  font-weight:600;
  margin-top:10px;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.summary-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:24px;
  padding:24px;
  border:1px solid #e6eef5;
  border-top:8px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  text-align:center;
}

.summary-card h2{
  color:#003b66;
  font-size:38px;
  font-weight:900;
}

.summary-card p{
  color:#536172;
  font-weight:900;
  margin-top:6px;
}

.section{margin-bottom:34px;}

.section-title{
  background:linear-gradient(135deg,#003b66,#005f99);
  color:white;
  padding:18px 24px;
  border-radius:20px;
  font-size:24px;
  font-weight:900;
  margin-bottom:18px;
  box-shadow:0 12px 26px rgba(0,0,0,.18);
}

.meeting-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:30px;
  padding:30px;
  margin-bottom:32px;
  border:1px solid #e6eef5;
  border-top:10px solid #00aeef;
  box-shadow:0 16px 34px rgba(0,0,0,.13);
}

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  margin-bottom:20px;
  border:1px solid #e6eef5;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.meeting-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.meeting-title{
  font-size:28px;
  color:#003b66;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.full{grid-column:1/3;}

label{
  color:#003b66;
  font-weight:900;
  display:block;
  margin-bottom:7px;
}

select,input,textarea{
  width:100%;
  padding:14px;
  border:1px solid #cfd8e3;
  border-radius:14px;
  font-size:14px;
  background:white;
  font-family:'Segoe UI',Arial,sans-serif;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

select:focus,input:focus,textarea:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
}

.activity-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 130px 120px;
  gap:14px;
  align-items:end;
  margin-bottom:14px;
  padding:16px;
  border-radius:18px;
  background:#f8fcff;
  border:1px solid #e6eef5;
}

.signature-row{
  display:grid;
  grid-template-columns:1fr 1fr 120px;
  gap:14px;
  align-items:end;
  margin-bottom:14px;
  padding:16px;
  border-radius:18px;
  background:#f8fcff;
  border:1px solid #e6eef5;
}

.saved-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}

.saved-item{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:22px;
  padding:20px;
  border:1px solid #e6eef5;
  border-top:7px solid #00aeef;
  box-shadow:0 10px 24px rgba(0,0,0,.10);
}

.saved-item h3{
  color:#003b66;
  font-size:20px;
  margin-bottom:8px;
}

.saved-item p{
  color:#536172;
  font-weight:800;
  font-size:14px;
  margin-bottom:5px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:35px;
  flex-wrap:wrap;
}

.saved-buttons{
  display:flex;
  justify-content:flex-start;
  gap:12px;
  margin-top:15px;
  flex-wrap:wrap;
}

button{
  border:none;
  color:white;
  padding:14px 24px;
  border-radius:16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

button:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.save-btn{background:linear-gradient(135deg,#16a34a,#22c55e);}
.print-btn{background:linear-gradient(135deg,#111827,#374151);}
.reset-btn{background:linear-gradient(135deg,#64748b,#334155);}
.back-btn{background:linear-gradient(135deg,#f59e0b,#d97706);}
.home-btn{background:linear-gradient(135deg,#003b66,#005f99);}
.add-btn{background:linear-gradient(135deg,#00aeef,#0284c7);}
.remove-btn{background:linear-gradient(135deg,#dc2626,#991b1b);}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:950px){
  body{padding:25px;}
  .container{padding:35px 22px;border-radius:28px;}
  h1{font-size:38px;}
  .grid,.activity-row,.signature-row{grid-template-columns:1fr;}
  .full{grid-column:1;}
}

@media print{
  body{background:white;padding:10px;}
  .buttons,.saved-buttons,.remove-btn,.add-btn,.saved-section{display:none;}
  .container{box-shadow:none;padding:15px;}
  .meeting-card,.card{break-inside:avoid;}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">📝</div>
  <div class="company-label">371Q Virtual Professional Safety Office</div>
  <h1>SMS Meetings</h1>
  <div class="subtitle">Operational Safety Meeting Minutes • Safety Promotion • 14 CFR Part 5</div>
  <div class="title-line"></div>
</div>

<div class="summary">
  <div class="summary-card">
    <h2 id="meetingNumber">1</h2>
    <p>CURRENT MEETING</p>
  </div>
  <div class="summary-card">
    <h2 id="activityCount">1</h2>
    <p>ACTIVITIES</p>
  </div>
  <div class="summary-card">
    <h2 id="savedCount">0</h2>
    <p>SAVED MEETINGS</p>
  </div>
  <div class="summary-card">
    <h2 id="modeText">NEW</h2>
    <p>MODE</p>
  </div>
</div>

<form id="meetingForm">

<div id="meetingContainer"></div>

<div class="buttons">
  <button type="button" id="mainSaveBtn" class="save-btn" onclick="saveMeeting()">💾 Save New Meeting</button>
  <button type="button" class="add-btn" onclick="newMeeting()">➕ New Meeting</button>
  <button type="button" class="print-btn" onclick="window.print()">🖨️ Print</button>
  <button type="button" class="reset-btn" onclick="clearCurrentForm()">🔄 Clear Current</button>
  <button type="button" class="back-btn" onclick="window.location.href='SMS-Policy.html'">← Back</button>
  <button type="button" class="home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
</div>

</form>

<div class="section saved-section">
  <div class="section-title">SAVED MEETINGS - EDIT OR DELETE</div>
  <div id="savedMeetingsList" class="saved-list"></div>
</div>

<div class="footer">
  371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
</div>

</div>

<script>
const storageKey = "smsPolicyMeetingsLocal";
let currentEditIndex = null;

function today(){
  return new Date().toISOString().split("T")[0];
}

function getSavedMeetings(){
  return JSON.parse(localStorage.getItem(storageKey)) || [];
}

function saveMeetingsToStorage(meetings){
  localStorage.setItem(storageKey, JSON.stringify(meetings));
}

function updateCounters(){
  const saved = getSavedMeetings();

  document.getElementById("savedCount").innerText = saved.length;
  document.getElementById("activityCount").innerText = document.querySelectorAll(".activity-row").length;

  if(currentEditIndex !== null){
    document.getElementById("meetingNumber").innerText = currentEditIndex + 1;
    document.getElementById("modeText").innerText = "EDIT";
    document.getElementById("mainSaveBtn").innerText = "✏️ Update Meeting";
  }else{
    document.getElementById("meetingNumber").innerText = saved.length + 1;
    document.getElementById("modeText").innerText = "NEW";
    document.getElementById("mainSaveBtn").innerText = "💾 Save New Meeting";
  }
}

function createBlankMeeting(){
  document.getElementById("meetingContainer").innerHTML = `
    <div class="meeting-card">
      <div class="meeting-head">
        <div class="meeting-title" id="formTitle">New Meeting</div>
      </div>

      <div class="section">
        <div class="section-title">MEETING INFORMATION</div>

        <div class="card">
          <div class="grid">
            <div>
              <label>Meeting Name *</label>
              <input id="meetingName" placeholder="Example: Operational Safety Meeting" required>
            </div>

            <div>
              <label>Status</label>
              <select id="meetingStatus">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
              </select>
            </div>

            <div>
              <label>Date *</label>
              <input type="date" id="meetingDate" value="${today()}" required>
            </div>

            <div>
              <label>Time</label>
              <input type="time" id="meetingTime">
            </div>

            <div>
              <label>Meeting Leader</label>
              <input id="meetingLeader" placeholder="Meeting leader">
            </div>

            <div>
              <label>Location</label>
              <input id="meetingLocation" placeholder="OPF Hangar / Shop / Office">
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">PENDING TASKS FROM PREVIOUS MEETING</div>
        <div class="card">
          <label>Pending Tasks</label>
          <textarea id="pendingTasks" placeholder="Write pending tasks from the previous meeting."></textarea>
        </div>
      </div>

      <div class="section">
        <div class="section-title">TASKS / ACTIVITIES</div>
        <div id="activitiesContainer"></div>
        <button type="button" class="add-btn" onclick="addActivity()">➕ Add Activity</button>
      </div>

      <div class="section">
        <div class="section-title">CONCLUSION</div>
        <div class="card">
          <label>Meeting Conclusion</label>
          <textarea id="meetingConclusion" placeholder="Write final conclusion, agreements, or next steps."></textarea>
        </div>
      </div>

      <div class="section">
        <div class="section-title">ATTENDEES / SIGNATURES</div>
        <div id="signaturesContainer"></div>
        <button type="button" class="add-btn" onclick="addSignature()">➕ Add Signature</button>
      </div>
    </div>
  `;

  addActivity();
  addSignature();
  updateCounters();
}

function addActivity(data = {}){
  const activityDiv = document.createElement("div");
  activityDiv.className = "activity-row";

  activityDiv.innerHTML = `
    <div>
      <label>Task / Activity *</label>
      <textarea class="activityText" placeholder="Write activity or task" required>${data.task || ""}</textarea>
    </div>

    <div>
      <label>Responsible</label>
      <input class="activityResponsible" placeholder="Responsible person" value="${data.responsible || ""}">
    </div>

    <div>
      <label>Due Date</label>
      <input type="date" class="activityDueDate" value="${data.dueDate || ""}">
    </div>

    <div>
      <label>Status</label>
      <select class="activityStatus">
        <option value="Open" ${data.status==="Open"?"selected":""}>Open</option>
        <option value="In Progress" ${data.status==="In Progress"?"selected":""}>In Progress</option>
        <option value="Closed" ${data.status==="Closed"?"selected":""}>Closed</option>
      </select>
    </div>

    <button type="button" class="remove-btn" onclick="removeActivity(this)">🗑 Remove</button>
  `;

  document.getElementById("activitiesContainer").appendChild(activityDiv);
  updateCounters();
}

function removeActivity(button){
  button.closest(".activity-row").remove();
  updateCounters();
}

function addSignature(data = {}){
  const signatureDiv = document.createElement("div");
  signatureDiv.className = "signature-row";

  signatureDiv.innerHTML = `
    <div>
      <label>Name</label>
      <input class="signatureName" placeholder="Attendee name" value="${data.name || ""}">
    </div>

    <div>
      <label>Signature / Initials</label>
      <input class="signatureValue" placeholder="Signature or initials" value="${data.signature || ""}">
    </div>

    <button type="button" class="remove-btn" onclick="removeSignature(this)">🗑 Remove</button>
  `;

  document.getElementById("signaturesContainer").appendChild(signatureDiv);
}

function removeSignature(button){
  button.closest(".signature-row").remove();
}

function collectFormData(){
  const activities = [];
  const signatures = [];

  document.querySelectorAll(".activity-row").forEach(activity=>{
    activities.push({
      task:activity.querySelector(".activityText").value.trim(),
      responsible:activity.querySelector(".activityResponsible").value.trim(),
      dueDate:activity.querySelector(".activityDueDate").value,
      status:activity.querySelector(".activityStatus").value
    });
  });

  document.querySelectorAll(".signature-row").forEach(signature=>{
    signatures.push({
      name:signature.querySelector(".signatureName").value.trim(),
      signature:signature.querySelector(".signatureValue").value.trim()
    });
  });

  return {
    meetingName:document.getElementById("meetingName").value.trim(),
    status:document.getElementById("meetingStatus").value,
    date:document.getElementById("meetingDate").value,
    time:document.getElementById("meetingTime").value,
    leader:document.getElementById("meetingLeader").value.trim(),
    location:document.getElementById("meetingLocation").value.trim(),
    pendingTasks:document.getElementById("pendingTasks").value.trim(),
    activities:activities,
    conclusion:document.getElementById("meetingConclusion").value.trim(),
    signatures:signatures,
    updatedAt:new Date().toLocaleString()
  };
}

function saveMeeting(){
  const data = collectFormData();

  if(!data.meetingName){
    alert("Please write the Meeting Name.");
    return;
  }

  const saved = getSavedMeetings();

  if(currentEditIndex !== null){
    data.createdAt = saved[currentEditIndex]?.createdAt || new Date().toLocaleString();
    saved[currentEditIndex] = data;
    saveMeetingsToStorage(saved);
    renderSavedMeetings();
    loadMeeting(currentEditIndex);
    alert("Meeting updated successfully.");
  }else{
    data.createdAt = new Date().toLocaleString();
    saved.push(data);
    saveMeetingsToStorage(saved);
    currentEditIndex = saved.length - 1;
    renderSavedMeetings();
    loadMeeting(currentEditIndex);
    alert("New meeting saved successfully.");
  }
}

function renderSavedMeetings(){
  const list = document.getElementById("savedMeetingsList");
  const saved = getSavedMeetings();

  list.innerHTML = "";

  if(saved.length === 0){
    list.innerHTML = `<div class="card"><label>No meetings saved yet.</label></div>`;
    updateCounters();
    return;
  }

  saved.forEach((meeting,index)=>{
    const item = document.createElement("div");
    item.className = "saved-item";

    item.innerHTML = `
      <h3>Meeting ${index + 1}: ${meeting.meetingName}</h3>
      <p><b>Date:</b> ${meeting.date || "N/A"}</p>
      <p><b>Status:</b> ${meeting.status || "Open"}</p>
      <p><b>Activities:</b> ${(meeting.activities || []).length}</p>
      <p><b>Updated:</b> ${meeting.updatedAt || "N/A"}</p>

      <div class="saved-buttons">
        <button type="button" class="add-btn" onclick="loadMeeting(${index})">✏️ Edit</button>
        <button type="button" class="remove-btn" onclick="deleteMeeting(${index})">🗑 Delete</button>
      </div>
    `;

    list.appendChild(item);
  });

  updateCounters();
}

function loadMeeting(index){
  const saved = getSavedMeetings();
  const meeting = saved[index];

  if(!meeting) return;

  currentEditIndex = index;
  createBlankMeeting();
  currentEditIndex = index;

  document.getElementById("formTitle").innerText = "Editing Meeting " + (index + 1);
  document.getElementById("meetingName").value = meeting.meetingName || "";
  document.getElementById("meetingStatus").value = meeting.status || "Open";
  document.getElementById("meetingDate").value = meeting.date || today();
  document.getElementById("meetingTime").value = meeting.time || "";
  document.getElementById("meetingLeader").value = meeting.leader || "";
  document.getElementById("meetingLocation").value = meeting.location || "";
  document.getElementById("pendingTasks").value = meeting.pendingTasks || "";
  document.getElementById("meetingConclusion").value = meeting.conclusion || "";

  document.getElementById("activitiesContainer").innerHTML = "";
  (meeting.activities || []).forEach(activity=>addActivity(activity));
  if((meeting.activities || []).length === 0) addActivity();

  document.getElementById("signaturesContainer").innerHTML = "";
  (meeting.signatures || []).forEach(signature=>addSignature(signature));
  if((meeting.signatures || []).length === 0) addSignature();

  currentEditIndex = index;
  updateCounters();
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteMeeting(index){
  const saved = getSavedMeetings();
  const meetingName = saved[index]?.meetingName || "this meeting";

  if(confirm("Do you want to delete " + meetingName + "?")){
    saved.splice(index,1);
    saveMeetingsToStorage(saved);

    currentEditIndex = null;
    createBlankMeeting();
    renderSavedMeetings();

    alert("Meeting deleted successfully.");
  }
}

function newMeeting(){
  currentEditIndex = null;
  createBlankMeeting();
  updateCounters();
  window.scrollTo({top:0,behavior:"smooth"});
}

function clearCurrentForm(){
  if(confirm("Do you want to clear the current form?")){
    currentEditIndex = null;
    createBlankMeeting();
  }
}

document.getElementById("meetingForm").addEventListener("submit", function(e){
  e.preventDefault();
  saveMeeting();
});

createBlankMeeting();
renderSavedMeetings();
</script>

</body>
</html>
