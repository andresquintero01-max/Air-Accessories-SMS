<script>
const storageKey = "smsPolicyMeetingsLocal";
let currentEditIndex = null;

function today(){
  return new Date().toISOString().split("T")[0];
}

function getSavedMeetings(){
  return JSON.parse(localStorage.getItem(storageKey)) || [];
}

function saveMeetingsToStorage(meetings){
  localStorage.setItem(storageKey, JSON.stringify(meetings));
}

function updateCounters(){
  const saved = getSavedMeetings();
  document.getElementById("savedCount").innerText = saved.length;
  document.getElementById("activityCount").innerText = document.querySelectorAll(".activity-row").length;

  if(currentEditIndex !== null){
    document.getElementById("meetingNumber").innerText = currentEditIndex + 1;
    document.getElementById("modeText").innerText = "EDIT";
    document.getElementById("mainSaveBtn").innerText = "✏️ Update Meeting";
  }else{
    document.getElementById("meetingNumber").innerText = saved.length + 1;
    document.getElementById("modeText").innerText = "NEW";
    document.getElementById("mainSaveBtn").innerText = "💾 Save New Meeting";
  }
}

function createBlankMeeting(){
  document.getElementById("meetingContainer").innerHTML = `
    <div class="meeting-card">
      <div class="meeting-head">
        <div class="meeting-title" id="formTitle">New Meeting</div>
      </div>

      <div class="section">
        <div class="section-title">MEETING INFORMATION</div>
        <div class="card">
          <div class="grid">
            <div>
              <label>Meeting Name *</label>
              <input id="meetingName" placeholder="Example: Operational Safety Meeting" required>
            </div>

            <div>
              <label>Status</label>
              <select id="meetingStatus">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
              </select>
            </div>

            <div>
              <label>Date *</label>
              <input type="date" id="meetingDate" value="${today()}" required>
            </div>

            <div>
              <label>Time</label>
              <input type="time" id="meetingTime">
            </div>

            <div>
              <label>Meeting Leader</label>
              <input id="meetingLeader" placeholder="Meeting leader">
            </div>

            <div>
              <label>Location</label>
              <input id="meetingLocation" placeholder="OPF Hangar / Shop / Office">
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">PENDING TASKS FROM PREVIOUS MEETING</div>
        <div class="card">
          <label>Pending Tasks</label>
          <textarea id="pendingTasks" placeholder="Write pending tasks from the previous meeting."></textarea>
        </div>
      </div>

      <div class="section">
        <div class="section-title">TASKS / ACTIVITIES</div>
        <div id="activitiesContainer"></div>
        <button type="button" class="add-btn" onclick="addActivity()">➕ Add Activity</button>
      </div>

      <div class="section">
        <div class="section-title">CONCLUSION</div>
        <div class="card">
          <label>Meeting Conclusion</label>
          <textarea id="meetingConclusion" placeholder="Write final conclusion, agreements, or next steps."></textarea>
        </div>
      </div>

      <div class="section">
        <div class="section-title">ATTENDEES / SIGNATURES</div>
        <div id="signaturesContainer"></div>
        <button type="button" class="add-btn" onclick="addSignature()">➕ Add Signature</button>
      </div>
    </div>
  `;

  addActivity();
  addSignature();
  updateCounters();
}

function addActivity(data = {}){
  const activityDiv = document.createElement("div");
  activityDiv.className = "activity-row";

  activityDiv.innerHTML = `
    <div>
      <label>Task / Activity *</label>
      <textarea class="activityText" placeholder="Write activity or task" required>${data.task || ""}</textarea>
    </div>

    <div>
      <label>Responsible</label>
      <input class="activityResponsible" placeholder="Responsible person" value="${data.responsible || ""}">
    </div>

    <div>
      <label>Due Date</label>
      <input type="date" class="activityDueDate" value="${data.dueDate || ""}">
    </div>

    <div>
      <label>Status</label>
      <select class="activityStatus">
        <option value="Open" ${data.status==="Open"?"selected":""}>Open</option>
        <option value="In Progress" ${data.status==="In Progress"?"selected":""}>In Progress</option>
        <option value="Closed" ${data.status==="Closed"?"selected":""}>Closed</option>
      </select>
    </div>

    <button type="button" class="remove-btn" onclick="removeActivity(this)">🗑 Remove</button>
  `;

  document.getElementById("activitiesContainer").appendChild(activityDiv);
  updateCounters();
}

function removeActivity(button){
  button.closest(".activity-row").remove();
  updateCounters();
}

function addSignature(data = {}){
  const signatureDiv = document.createElement("div");
  signatureDiv.className = "signature-row";

  signatureDiv.innerHTML = `
    <div>
      <label>Name</label>
      <input class="signatureName" placeholder="Attendee name" value="${data.name || ""}">
    </div>

    <div>
      <label>Signature / Initials</label>
      <input class="signatureValue" placeholder="Signature or initials" value="${data.signature || ""}">
    </div>

    <button type="button" class="remove-btn" onclick="removeSignature(this)">🗑 Remove</button>
  `;

  document.getElementById("signaturesContainer").appendChild(signatureDiv);
}

function removeSignature(button){
  button.closest(".signature-row").remove();
}

function collectFormData(){
  const activities = [];
  const signatures = [];

  document.querySelectorAll(".activity-row").forEach(activity=>{
    activities.push({
      task:activity.querySelector(".activityText").value.trim(),
      responsible:activity.querySelector(".activityResponsible").value.trim(),
      dueDate:activity.querySelector(".activityDueDate").value,
      status:activity.querySelector(".activityStatus").value
    });
  });

  document.querySelectorAll(".signature-row").forEach(signature=>{
    signatures.push({
      name:signature.querySelector(".signatureName").value.trim(),
      signature:signature.querySelector(".signatureValue").value.trim()
    });
  });

  return {
    meetingName:document.getElementById("meetingName").value.trim(),
    status:document.getElementById("meetingStatus").value,
    date:document.getElementById("meetingDate").value,
    time:document.getElementById("meetingTime").value,
    leader:document.getElementById("meetingLeader").value.trim(),
    location:document.getElementById("meetingLocation").value.trim(),
    pendingTasks:document.getElementById("pendingTasks").value.trim(),
    activities:activities,
    conclusion:document.getElementById("meetingConclusion").value.trim(),
    signatures:signatures,
    updatedAt:new Date().toLocaleString()
  };
}

function saveMeeting(){
  const data = collectFormData();

  if(!data.meetingName){
    alert("Please write the Meeting Name.");
    return;
  }

  const saved = getSavedMeetings();

  if(currentEditIndex !== null){
    data.createdAt = saved[currentEditIndex]?.createdAt || new Date().toLocaleString();
    saved[currentEditIndex] = data;
    alert("Meeting updated successfully.");
  }else{
    data.createdAt = new Date().toLocaleString();
    saved.push(data);
    currentEditIndex = saved.length - 1;
    alert("New meeting saved successfully.");
  }

  saveMeetingsToStorage(saved);
  renderSavedMeetings();
  loadMeeting(currentEditIndex);
}

function renderSavedMeetings(){
  const list = document.getElementById("savedMeetingsList");
  const saved = getSavedMeetings();

  list.innerHTML = "";

  if(saved.length === 0){
    list.innerHTML = `<div class="card"><label>No meetings saved yet.</label></div>`;
    updateCounters();
    return;
  }

  saved.forEach((meeting,index)=>{
    const item = document.createElement("div");
    item.className = "saved-item";

    item.innerHTML = `
      <h3>Meeting ${index + 1}: ${meeting.meetingName}</h3>
      <p><b>Date:</b> ${meeting.date || "N/A"}</p>
      <p><b>Status:</b> ${meeting.status || "Open"}</p>
      <p><b>Activities:</b> ${(meeting.activities || []).length}</p>

      <div class="buttons" style="margin-top:15px;justify-content:flex-start;">
        <button type="button" class="add-btn" onclick="loadMeeting(${index})">✏️ Edit</button>
        <button type="button" class="remove-btn" onclick="deleteMeeting(${index})">🗑 Delete</button>
      </div>
    `;

    list.appendChild(item);
  });

  updateCounters();
}

function loadMeeting(index){
  const saved = getSavedMeetings();
  const meeting = saved[index];

  if(!meeting) return;

  currentEditIndex = index;
  createBlankMeeting();
  currentEditIndex = index;

  document.getElementById("formTitle").innerText = "Editing Meeting " + (index + 1);
  document.getElementById("meetingName").value = meeting.meetingName || "";
  document.getElementById("meetingStatus").value = meeting.status || "Open";
  document.getElementById("meetingDate").value = meeting.date || today();
  document.getElementById("meetingTime").value = meeting.time || "";
  document.getElementById("meetingLeader").value = meeting.leader || "";
  document.getElementById("meetingLocation").value = meeting.location || "";
  document.getElementById("pendingTasks").value = meeting.pendingTasks || "";
  document.getElementById("meetingConclusion").value = meeting.conclusion || "";

  document.getElementById("activitiesContainer").innerHTML = "";
  (meeting.activities || []).forEach(activity=>addActivity(activity));
  if((meeting.activities || []).length === 0) addActivity();

  document.getElementById("signaturesContainer").innerHTML = "";
  (meeting.signatures || []).forEach(signature=>addSignature(signature));
  if((meeting.signatures || []).length === 0) addSignature();

  currentEditIndex = index;
  updateCounters();
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteMeeting(index){
  const saved = getSavedMeetings();
  const meetingName = saved[index]?.meetingName || "this meeting";

  if(confirm("Do you want to delete " + meetingName + "?")){
    saved.splice(index,1);
    saveMeetingsToStorage(saved);

    currentEditIndex = null;
    createBlankMeeting();
    renderSavedMeetings();

    alert("Meeting deleted successfully.");
  }
}

function newMeeting(){
  currentEditIndex = null;
  createBlankMeeting();
  updateCounters();
  window.scrollTo({top:0,behavior:"smooth"});
}

function clearCurrentForm(){
  if(confirm("Do you want to clear the current form?")){
    currentEditIndex = null;
    createBlankMeeting();
  }
}

document.getElementById("meetingForm").addEventListener("submit", function(e){
  e.preventDefault();
  saveMeeting();
});

createBlankMeeting();
renderSavedMeetings();
</script>
