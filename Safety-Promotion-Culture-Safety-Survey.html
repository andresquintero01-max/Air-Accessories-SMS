<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safety Survey</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1350px;
  margin:auto;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
  position:relative;
  overflow:hidden;
}

.container::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle,rgba(0,174,239,.15),transparent 70%);
  top:-170px;
  right:-120px;
}

.container::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:radial-gradient(circle,rgba(0,59,102,.14),transparent 70%);
  bottom:-150px;
  left:-120px;
}

.header,.top-buttons,.form-box,.records-box,#resultBox,.bottom-buttons,.footer{
  position:relative;
  z-index:2;
}

.header{text-align:center;margin-bottom:38px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:44px;
  box-shadow:0 16px 34px rgba(0,0,0,.28);
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

.header h1{
  font-size:56px;
  color:#003b66;
  margin-bottom:12px;
  font-weight:900;
}

.header p{
  color:#536172;
  font-size:19px;
  font-weight:600;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.top-buttons,.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:35px;
}

button,.btn{
  border:none;
  color:white;
  padding:15px 24px;
  border-radius:15px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 10px 22px rgba(0,0,0,.22);
}

button:hover,.btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.culture-btn,.new-btn,.submit-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.home-btn,.save-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.delete-btn{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.form-box,.records-box{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  padding:32px;
  border-radius:28px;
  margin-bottom:32px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
}

.section-title{
  color:#003b66;
  font-size:28px;
  font-weight:900;
  margin-bottom:22px;
  border-left:8px solid #00aeef;
  padding-left:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

label{
  display:block;
  font-weight:900;
  color:#003b66;
  margin-top:15px;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  padding:15px;
  border:1px solid #cfd8e3;
  border-radius:15px;
  font-size:15px;
  background:#f9fbfd;
  outline:none;
  transition:.25s;
}

input:focus,select:focus,textarea:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
  background:white;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.question-box{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-top:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  border-left:5px solid #00aeef;
}

.record-card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-top:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.10);
  color:#003b66;
  line-height:1.7;
  border-left:5px solid #00aeef;
}

.result-box{
  padding:22px;
  border-radius:22px;
  margin-bottom:25px;
  font-size:18px;
  font-weight:900;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.hidden{display:none;}

.empty{
  text-align:center;
  color:#536172;
  font-size:19px;
  padding:35px;
  background:#f8fcff;
  border-radius:24px;
  border:1px solid #e6eef5;
  font-weight:700;
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:800px){
  body{padding:25px;}
  .container{padding:35px 22px;border-radius:28px;}
  .header h1{font-size:40px;}
  button,.btn{width:100%;}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">📋</div>
    <div class="company-label">371Q Virtual Professional Safety Office</div>
    <h1>Safety Survey</h1>
    <p>Safety culture, employee perception, reporting confidence and continuous improvement survey.</p>
    <div class="title-line"></div>
  </div>

  <div class="top-buttons">
    <button class="btn culture-btn" onclick="goBack()">👥 Safety Promotion Culture</button>
    <button class="btn new-btn" onclick="newSurvey()">➕ New Survey / Another Person</button>
    <button class="btn home-btn" onclick="goHome()">🏠 Home</button>
  </div>

  <div id="resultBox" class="result-box hidden"></div>

  <div class="form-box" id="formBox">

    <div class="section-title">Employee Information</div>

    <div class="grid">
      <div>
        <label>Employee Name</label>
        <input id="employeeName" placeholder="Enter employee name">
      </div>

      <div>
        <label>Employee Number / Company ID</label>
        <input id="employeeNumber" placeholder="Enter employee number">
      </div>

      <div>
        <label>Date</label>
        <input id="surveyDate" type="date">
      </div>

      <div>
        <label>Department / Area</label>
        <input id="department" placeholder="Maintenance, QC, Stores, Admin...">
      </div>
    </div>

    <div class="section-title" style="margin-top:32px;">Safety Culture Questions</div>

    <div class="question-box">
      <label>1. I feel comfortable reporting safety hazards or concerns.</label>
      <select id="q1">
        <option value="">Select answer</option>
        <option>Strongly Agree</option>
        <option>Agree</option>
        <option>Neutral</option>
        <option>Disagree</option>
        <option>Strongly Disagree</option>
      </select>
    </div>

    <div class="question-box">
      <label>2. Management supports safety reporting and corrective actions.</label>
      <select id="q2">
        <option value="">Select answer</option>
        <option>Strongly Agree</option>
        <option>Agree</option>
        <option>Neutral</option>
        <option>Disagree</option>
        <option>Strongly Disagree</option>
      </select>
    </div>

    <div class="question-box">
      <label>3. I receive enough safety information, alerts, bulletins, or lessons learned.</label>
      <select id="q3">
        <option value="">Select answer</option>
        <option>Strongly Agree</option>
        <option>Agree</option>
        <option>Neutral</option>
        <option>Disagree</option>
        <option>Strongly Disagree</option>
      </select>
    </div>

    <div class="question-box">
      <label>4. Safety procedures are clear and easy to follow.</label>
      <select id="q4">
        <option value="">Select answer</option>
        <option>Strongly Agree</option>
        <option>Agree</option>
        <option>Neutral</option>
        <option>Disagree</option>
        <option>Strongly Disagree</option>
      </select>
    </div>

    <div class="question-box">
      <label>5. I have the proper tools, equipment, and resources to work safely.</label>
      <select id="q5">
        <option value="">Select answer</option>
        <option>Strongly Agree</option>
        <option>Agree</option>
        <option>Neutral</option>
        <option>Disagree</option>
        <option>Strongly Disagree</option>
      </select>
    </div>

    <div class="question-box">
      <label>6. Corrective actions are communicated and followed up properly.</label>
      <select id="q6">
        <option value="">Select answer</option>
        <option>Strongly Agree</option>
        <option>Agree</option>
        <option>Neutral</option>
        <option>Disagree</option>
        <option>Strongly Disagree</option>
      </select>
    </div>

    <div class="question-box">
      <label>7. What safety improvement would you recommend?</label>
      <textarea id="recommendation" placeholder="Write employee recommendation here..."></textarea>
    </div>

    <br>
    <button class="save-btn" onclick="saveSurvey()">💾 Save Survey</button>

  </div>

  <div class="records-box">
    <h2 style="color:#003b66;margin-bottom:15px;">Safety Survey Records</h2>
    <div id="recordsList"></div>
  </div>

  <div class="bottom-buttons">
    <button class="home-btn" onclick="goHome()">🏠 Home</button>
    <button class="culture-btn" onclick="goBack()">👥 Safety Promotion Culture</button>
  </div>

  <div class="footer">
    371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const surveysRef = ref(db, "safetyPromotion/safetySurveys");

document.getElementById("surveyDate").value =
new Date().toISOString().split("T")[0];

function getValue(id){
  return document.getElementById(id).value.trim();
}

window.saveSurvey = function(){

  const employeeName = getValue("employeeName");
  const employeeNumber = getValue("employeeNumber");
  const surveyDate = getValue("surveyDate");

  if(employeeName === "" || employeeNumber === "" || surveyDate === ""){
    alert("Please complete Employee Name, Employee Number, and Date.");
    return;
  }

  const newRef = push(surveysRef);

  const survey = {
    id:newRef.key,
    employeeName:employeeName,
    employeeNumber:employeeNumber,
    surveyDate:surveyDate,
    department:getValue("department"),
    q1:getValue("q1"),
    q2:getValue("q2"),
    q3:getValue("q3"),
    q4:getValue("q4"),
    q5:getValue("q5"),
    q6:getValue("q6"),
    recommendation:getValue("recommendation"),
    result:"Completed",
    createdDate:new Date().toLocaleString(),
    timestamp:new Date().toISOString()
  };

  set(newRef, survey).then(() => {

    const resultBox = document.getElementById("resultBox");
    resultBox.className = "result-box success";
    resultBox.innerHTML = `
      ✅ Safety Survey saved successfully.<br><br>
      Employee: ${employeeName}<br>
      Employee Number: ${employeeNumber}<br>
      Date: ${surveyDate}
    `;

    resultBox.classList.remove("hidden");
    resultBox.scrollIntoView({behavior:"smooth"});
  });
};

function displayRecords(){

  const recordsList = document.getElementById("recordsList");

  onValue(surveysRef, snapshot => {

    recordsList.innerHTML = "";

    if(!snapshot.exists()){
      recordsList.innerHTML = `<div class="empty">No Safety Survey records saved yet.</div>`;
      return;
    }

    const records = [];

    snapshot.forEach(child => {
      records.push({
        key:child.key,
        data:child.val()
      });
    });

    records.reverse().forEach((record,index) => {

      const div = document.createElement("div");
      div.className = "record-card";

      div.innerHTML = `
        <strong>${index + 1}. Employee:</strong> ${record.data.employeeName || "N/A"}<br>
        <strong>Employee Number:</strong> ${record.data.employeeNumber || "N/A"}<br>
        <strong>Department:</strong> ${record.data.department || "N/A"}<br>
        <strong>Date:</strong> ${record.data.surveyDate || "N/A"}<br>
        <strong>Result:</strong> ${record.data.result || "Completed"}<br><br>

        <strong>Q1 Reporting Confidence:</strong> ${record.data.q1 || "N/A"}<br>
        <strong>Q2 Management Support:</strong> ${record.data.q2 || "N/A"}<br>
        <strong>Q3 Safety Communication:</strong> ${record.data.q3 || "N/A"}<br>
        <strong>Q4 Procedures Clear:</strong> ${record.data.q4 || "N/A"}<br>
        <strong>Q5 Tools / Resources:</strong> ${record.data.q5 || "N/A"}<br>
        <strong>Q6 Corrective Action Follow-up:</strong> ${record.data.q6 || "N/A"}<br><br>

        <strong>Recommendation:</strong><br>
        ${record.data.recommendation || "N/A"}<br><br>

        <button class="delete-btn" onclick="deleteSurvey('${record.key}')">🗑 Delete Record</button>
      `;

      recordsList.appendChild(div);
    });
  });
}

window.deleteSurvey = function(id){

  if(!confirm("Are you sure you want to delete this survey record?")){
    return;
  }

  remove(ref(db, "safetyPromotion/safetySurveys/" + id)).then(() => {
    alert("Survey record deleted successfully.");
  });
};

window.newSurvey = function(){
  document.getElementById("employeeName").value = "";
  document.getElementById("employeeNumber").value = "";
  document.getElementById("department").value = "";
  document.getElementById("surveyDate").value = new Date().toISOString().split("T")[0];

  document.getElementById("q1").value = "";
  document.getElementById("q2").value = "";
  document.getElementById("q3").value = "";
  document.getElementById("q4").value = "";
  document.getElementById("q5").value = "";
  document.getElementById("q6").value = "";
  document.getElementById("recommendation").value = "";

  document.getElementById("resultBox").classList.add("hidden");
  document.getElementById("formBox").scrollIntoView({behavior:"smooth"});
};

window.goBack = function(){
  window.location.href = "Safety-Promotion-Culture.html";
};

window.goHome = function(){
  window.location.href = "index.html";
};

displayRecords();

</script>

</body>
</html>
