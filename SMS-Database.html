<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMS Database</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:40px;
  font-family:'Segoe UI', Arial, sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(0,174,239,0.25), transparent 30%),
    radial-gradient(circle at bottom right, rgba(0,59,102,0.35), transparent 35%),
    linear-gradient(rgba(2,23,48,0.88), rgba(2,23,48,0.94)),
    url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.page{
  max-width:1500px;
  margin:auto;
  background:rgba(255,255,255,0.97);
  backdrop-filter:blur(14px);
  border-radius:38px;
  padding:45px;
  box-shadow:0 28px 70px rgba(0,0,0,0.38);
  position:relative;
  overflow:hidden;
}

.page::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle,rgba(0,174,239,0.16),transparent 70%);
  top:-170px;
  right:-120px;
}

.page::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:radial-gradient(circle,rgba(0,59,102,0.14),transparent 70%);
  bottom:-150px;
  left:-120px;
}

.header,
.toolbar,
.container,
.bottom-home,
.footer{
  position:relative;
  z-index:2;
}

.header{
  text-align:center;
  margin-bottom:42px;
}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  box-shadow:0 16px 34px rgba(0,0,0,0.28);
}

.company{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

.header-badge{
  display:inline-block;
  background:#ecfeff;
  color:#003b66;
  padding:10px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.8px;
  margin-bottom:16px;
}

h1{
  color:#003b66;
  font-size:56px;
  margin:0;
  font-weight:900;
  line-height:1.1;
}

.subtitle{
  color:#536172;
  font-size:19px;
  margin-top:12px;
  font-weight:600;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.toolbar{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  padding:26px;
  border-radius:28px;
  box-shadow:0 14px 30px rgba(0,0,0,0.11);
  margin-bottom:28px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
}

.toolbar-buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  justify-content:center;
}

.tool-btn{
  border:none;
  padding:15px 24px;
  border-radius:16px;
  font-weight:900;
  color:white;
  cursor:pointer;
  font-size:15px;
  box-shadow:0 10px 22px rgba(0,0,0,0.20);
  transition:0.25s;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.tool-btn:hover{
  transform:translateY(-4px);
  filter:brightness(1.08);
}

.filter-btn,
.home-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.excel-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.hazard-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.filter-panel{
  display:none;
  margin-top:22px;
  background:#f8fcff;
  padding:22px;
  border-radius:22px;
  border:1px solid #e6eef5;
}

.filter-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.filter-panel input,
.filter-panel select{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #cfd8e3;
  font-size:14px;
  outline:none;
  background:white;
}

.filter-panel input:focus,
.filter-panel select:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,0.14);
}

.record{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  margin-bottom:26px;
  padding:28px;
  border-radius:28px;
  box-shadow:0 14px 30px rgba(0,0,0,0.11);
  transition:0.25s;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  position:relative;
  overflow:hidden;
}

.record:hover{
  transform:translateY(-5px);
  box-shadow:0 24px 46px rgba(0,0,0,0.18);
}

.record::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:radial-gradient(circle,rgba(0,174,239,0.10),transparent 70%);
  top:-90px;
  right:-70px;
}

.top-row,
.info,
.edit-area{
  position:relative;
  z-index:2;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.report-id{
  font-size:23px;
  font-weight:900;
  color:#003b66;
}

.report-id a{
  color:#005f99;
  text-decoration:none;
}

.actions-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap;
}

.status-box{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.status-group{
  text-align:center;
}

.status{
  padding:9px 15px;
  border-radius:999px;
  color:white;
  font-size:12px;
  font-weight:900;
  display:inline-block;
  box-shadow:0 5px 14px rgba(0,0,0,0.22);
}

.open{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.close{
  background:linear-gradient(135deg,#475569,#64748b);
}

.type-toggle-btn{
  color:white;
  border:none;
  border-radius:15px;
  padding:13px 21px;
  cursor:pointer;
  font-weight:900;
  font-size:14px;
  box-shadow:0 9px 20px rgba(0,0,0,0.22);
}

.type-vor{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.type-mor{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}
  
.manual-status-btn,
.edit-btn,
.save-btn{
  color:white;
  border:none;
  border-radius:15px;
  padding:13px 21px;
  cursor:pointer;
  font-weight:900;
  font-size:14px;
  box-shadow:0 9px 20px rgba(0,0,0,0.22);
}

.manual-open{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.manual-closed{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.edit-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.save-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  margin-top:10px;
}

.delete-btn{
  background:linear-gradient(135deg,#dc2626,#ef4444);
  color:white;
  border:none;
  border-radius:50%;
  width:46px;
  height:46px;
  cursor:pointer;
  font-size:18px;
  font-weight:900;
  box-shadow:0 9px 20px rgba(0,0,0,0.22);
}

.risk-green{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:white;
}

.risk-yellow{
  background:linear-gradient(135deg,#facc15,#f59e0b);
  color:#111827;
}

.risk-red{
  background:linear-gradient(135deg,#dc2626,#ef4444);
  color:white;
}

.risk-empty{
  background:linear-gradient(135deg,#e5e7eb,#cbd5e1);
  color:#003b66;
}

.risk-value{
  margin-top:10px;
  padding:16px 18px;
  border-radius:18px;
  font-size:15px;
  font-weight:900;
  min-width:220px;
  text-align:center;
  box-shadow:0 9px 20px rgba(0,0,0,0.18);
}

.info{
  margin-top:14px;
  line-height:1.8;
  color:#071f47;
  font-size:15px;
  background:#f8fcff;
  padding:20px;
  border-radius:20px;
  border:1px solid #e6eef5;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px 24px;
}

.full-info{
  grid-column:1 / 3;
}

.label{
  font-weight:900;
  color:#003b66;
}

.edit-area{
  margin-top:18px;
  display:none;
  background:#f8fcff;
  padding:22px;
  border-radius:22px;
  border:1px solid #e6eef5;
}

.edit-area label{
  color:#003b66;
  font-weight:900;
}

.edit-area input,
.edit-area textarea,
.edit-area select{
  width:100%;
  padding:14px;
  margin-top:8px;
  margin-bottom:14px;
  border:1px solid #cfd8e3;
  border-radius:14px;
  font-family:'Segoe UI', Arial, sans-serif;
  font-size:14px;
  outline:none;
  background:white;
}

.edit-area input:focus,
.edit-area textarea:focus,
.edit-area select:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,0.14);
}

.edit-area textarea{
  min-height:90px;
  resize:vertical;
}

.nav-between,
.bottom-home{
  background:rgba(255,255,255,0.62);
  border:1px solid rgba(230,238,245,0.95);
  padding:18px;
  border-radius:24px;
  margin:12px 0 28px 0;
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  backdrop-filter:blur(8px);
}

.bottom-home{
  margin-top:40px;
}

.empty{
  text-align:center;
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  padding:50px;
  border-radius:26px;
  box-shadow:0 22px 55px rgba(0,0,0,0.18);
  font-size:22px;
  color:#536172;
  font-weight:800;
  border:1px solid #e6eef5;
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}
.cost-btn{
  background:linear-gradient(135deg,#0f766e,#00aeef);
  color:white;
  border:none;
  border-radius:15px;
  padding:13px 21px;
  cursor:pointer;
  font-weight:900;
  font-size:14px;
  box-shadow:0 9px 20px rgba(0,0,0,0.22);
}

.cost-area{
  margin-top:18px;
  display:none;
  background:#f0fdff;
  padding:22px;
  border-radius:22px;
  border:1px solid #bae6fd;
  position:relative;
  z-index:2;
}

.cost-area h3{
  color:#003b66;
  margin-top:0;
}

.cost-row{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:12px;
  margin-bottom:12px;
}

.cost-row input{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #cfd8e3;
  font-size:14px;
}

.cost-total{
  margin-top:16px;
  padding:16px;
  border-radius:18px;
  background:white;
  color:#003b66;
  font-size:22px;
  font-weight:900;
  border:1px solid #e6eef5;
}
@media(max-width:900px){
  body{
    padding:18px;
  }

  .page{
    padding:22px;
    border-radius:28px;
  }

  h1{
    font-size:42px;
  }

  .top-row,
  .status-box{
    flex-direction:column;
  }

  .risk-value{
    width:100%;
  }

  .filter-grid,
  .info-grid{
    grid-template-columns:1fr;
  }

  .full-info{
    grid-column:1;
  }

  .tool-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="page">

<div class="header">
  <div class="logo">🗂️</div>
  <div class="company">371Q Virtual Professional Safety Office</div>
  <div class="header-badge">SAFETY MANAGEMENT SYSTEM</div>
  <h1>SMS Database</h1>
  <div class="subtitle">Real-Time Hazard Reports, Risk Status and Safety Records</div>
  <div class="title-line"></div>
</div>

<div class="toolbar">

  <div class="toolbar-buttons">

    <button class="tool-btn filter-btn" onclick="toggleFilters()">🔎 Filters</button>

    <button class="tool-btn excel-btn" onclick="downloadExcel()">📥 Download Excel</button>

    <a class="tool-btn hazard-btn" href="Hazard-Identification.html">⚠️ Hazard Identification</a>

  </div>

  <div class="filter-panel" id="filterPanel">

    <div class="filter-grid">

      <input type="text" id="searchInput" placeholder="Search title, name, aircraft, airport..." oninput="applyFilters()">

      <input type="date" id="dateFromFilter" onchange="applyFilters()" title="Date From">

      <input type="date" id="dateToFilter" onchange="applyFilters()" title="Date To">

      <select id="typeFilter" onchange="applyFilters()">
        <option value="">All Report Types</option>
        <option value="MOR">MOR</option>
        <option value="VOR">VOR</option>
      </select>

      <select id="statusFilter" onchange="applyFilters()">
    <option value="">All Status</option>
    <option value="OPEN">Open</option>
    <option value="CLOSED">Closed</option>
    </select>

    </div>

  </div>

</div>

<div class="container" id="data"></div>

<div class="bottom-home">
  <a class="tool-btn hazard-btn" href="Hazard-Identification.html">⚠️ Hazard Identification</a>
  <a class="tool-btn home-btn" href="index.html">🏠 Home</a>
</div>

<div class="footer">
  371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
</div>

</div>
  <script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getDatabase,
ref,
get,
child,
remove,
update
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const container = document.getElementById("data");

let allReports = [];

window.toggleFilters = function(){
  const panel = document.getElementById("filterPanel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
};

window.deleteReport = function(key){

const confirmation =
confirm("Are you sure you want to delete this SMS report?");

if(confirmation){

remove(ref(db,"smsReports/"+key)).then(()=>{

document.getElementById("record-"+key).remove();

allReports = allReports.filter(report => report.key !== key);

applyFilters();

});

}

};

window.showEdit = function(key){

const editBox = document.getElementById("edit-"+key);

editBox.style.display =
editBox.style.display === "block" ? "none" : "block";

};

window.saveEdit = function(key){

const title =
document.getElementById("edit-title-"+key).value;

if(!title.trim()){
alert("Title is required.");
return;
}

update(ref(db,"smsReports/"+key),{

title:title,
reporterName:document.getElementById("edit-reporterName-"+key).value,
date:document.getElementById("edit-date-"+key).value,
flightNumber:document.getElementById("edit-flightNumber-"+key).value,
aircraftRegistration:document.getElementById("edit-aircraftRegistration-"+key).value,
airport:document.getElementById("edit-airport-"+key).value,
destination:document.getElementById("edit-destination-"+key).value,
reportType:document.getElementById("edit-reportType-"+key).value,
whatHappened:document.getElementById("edit-whatHappened-"+key).value,
recommendation:document.getElementById("edit-recommendation-"+key).value

}).then(()=>{

alert("Report updated successfully.");
location.reload();

});

};

window.toggleReportStatus = function(key,currentStatus){

const newStatus =
currentStatus === "CLOSED" ? "OPEN" : "CLOSED";

update(ref(db,"smsReports/"+key),{

status:newStatus,
updatedAt:new Date().toLocaleString()

}).then(()=>{

alert("Report status changed to " + newStatus + ".");
location.reload();

});

};

window.toggleReportType = function(key,currentType){

const newType =
currentType === "VOR" ? "MOR" : "VOR";

update(ref(db,"smsReports/"+key),{
reportType:newType,
updatedAt:new Date().toLocaleString()
}).then(()=>{
location.reload();
});

};    
function getRiskClass(value){

if(value === undefined || value === null || value === ""){
return "risk-empty";
}

value = String(value).toUpperCase();

if(value === "NOT ASSESSED" || value === "N/A"){
return "risk-empty";
}

const low = ["C1","D2","E3","D1","E2","E1"];
const medium = ["A1","B2","C3","D4","E5","B1","C2","D3","E4"];
const high = ["A2","B3","C4","D5"];
const extreme = ["A5","A4","A3","B5","B4","C5"];

if(low.includes(value)){
return "risk-green";
}

if(medium.includes(value)){
return "risk-yellow";
}

if(high.includes(value) || extreme.includes(value)){
return "risk-red";
}

return "risk-empty";

}

function getRiskText(value){

if(value === undefined || value === null || value === ""){
return "NOT ASSESSED";
}

value = String(value).toUpperCase();

if(value === "NOT ASSESSED" || value === "N/A"){
return "NOT ASSESSED";
}

const low = ["C1","D2","E3","D1","E2","E1"];
const medium = ["A1","B2","C3","D4","E5","B1","C2","D3","E4"];
const high = ["A2","B3","C4","D5"];
const extreme = ["A5","A4","A3","B5","B4","C5"];

if(low.includes(value)){
return "ACCEPTABLE 🟢";
}

if(medium.includes(value)){
return "TOLERABLE 🟡";
}

if(high.includes(value) || extreme.includes(value)){
return "NOT ACCEPTABLE 🔴";
}

return "NOT ASSESSED";

}
window.showCosts = function(key){

const box = document.getElementById("cost-"+key);
box.style.display = box.style.display === "block" ? "none" : "block";

const list = document.getElementById("cost-list-"+key);

if(list.children.length === 0){

const report = allReports.find(r => r.key === key);
const savedCosts = report?.item?.costs || [];

if(savedCosts.length > 0){

savedCosts.forEach(cost=>{
addCostRow(key,cost.description,cost.amount);
});

}else{

addCostRow(key,"","");

}

}

calculateCostTotal(key);

};

window.addCostRow = function(key,description="",amount=""){

const list = document.getElementById("cost-list-"+key);

const row = document.createElement("div");
row.className = "cost-row";

row.innerHTML = `

<input type="text" class="cost-description-${key}" placeholder="Cost Description" value="${description || ""}">

<input type="number" class="cost-amount-${key}" placeholder="Amount $" value="${amount || ""}" oninput="calculateCostTotal('${key}')">

<button class="delete-btn" onclick="this.parentElement.remove(); calculateCostTotal('${key}')">
X
</button>

`;

list.appendChild(row);

calculateCostTotal(key);

};

window.calculateCostTotal = function(key){

let total = 0;

document.querySelectorAll(".cost-amount-"+key).forEach(input=>{
total += Number(input.value) || 0;
});

document.getElementById("cost-total-"+key).innerText =
"Total Event Cost: $" + total.toLocaleString();

return total;

};

window.saveCosts = function(key){

const descriptions = document.querySelectorAll(".cost-description-"+key);
const amounts = document.querySelectorAll(".cost-amount-"+key);

let costs = [];

descriptions.forEach((input,index)=>{

const description = input.value.trim();
const amount = Number(amounts[index].value) || 0;

if(description !== "" || amount > 0){
costs.push({
description:description,
amount:amount
});
}

});

const totalCost = calculateCostTotal(key);

update(ref(db,"smsReports/"+key),{
costs:costs,
totalCost:totalCost,
updatedAt:new Date().toLocaleString()
}).then(()=>{

alert("Costs saved successfully.");
location.reload();

});

};
function renderReports(reports){

container.innerHTML = "";

if(reports.length === 0){

container.innerHTML = `
<div class="empty">
No SMS reports found
</div>
`;

return;

}

reports.forEach((report,index)=>{

const key = report.key;
const item = report.item;

const div = document.createElement("div");

div.className = "record";
div.id = "record-"+key;

const manualStatus = item.status || "OPEN";
const reportType = item.reportType || "N/A";

const reportTypeClass =
reportType === "MOR" ? "type-mor" :
reportType === "VOR" ? "type-vor" :
"type-mor";

const manualStatusClass =
manualStatus === "CLOSED"
? "manual-closed"
: "manual-open";

const riskAssessmentStatus =
item.riskClosed === true
? '<div class="status close">RISK ASSESSMENT CLOSED</div>'
: '<div class="status open">RISK ASSESSMENT OPEN</div>';

const residualRiskAssessmentStatus =
item.residualRiskClosed === true
? '<div class="status close">RESIDUAL RISK CLOSED</div>'
: '<div class="status open">RESIDUAL RISK OPEN</div>';

const riskClass =
item.riskClosed === true ? getRiskClass(item.risk) : "risk-empty";

const residualClass =
item.residualRiskClosed === true ? getRiskClass(item.residualRisk) : "risk-empty";

const riskText =
item.riskClosed === true ? getRiskText(item.risk) : "NOT ASSESSED";

const residualText =
item.residualRiskClosed === true ? getRiskText(item.residualRisk) : "NOT ASSESSED";

window.applyFilters = function(){

const searchText =
document.getElementById("searchInput").value.toLowerCase();

const dateFrom =
document.getElementById("dateFromFilter").value;

const dateTo =
document.getElementById("dateToFilter").value;

const typeFilter =
document.getElementById("typeFilter").value;

const statusFilter =
document.getElementById("statusFilter").value;

const filtered = allReports.filter(report=>{

const item = report.item;

const generalText = `
${item.reportId || ""}
${item.title || ""}
${item.reporterName || ""}
${item.date || ""}
${item.flightNumber || ""}
${item.aircraftRegistration || ""}
${item.airport || ""}
${item.destination || ""}
${item.reportType || ""}
${item.whatHappened || ""}
${item.recommendation || ""}
${item.risk || ""}
${item.residualRisk || ""}
`.toLowerCase();

const matchSearch =
generalText.includes(searchText);

const reportDate = item.date || "";

const matchDate =
(dateFrom === "" || reportDate >= dateFrom) &&
(dateTo === "" || reportDate <= dateTo);

const matchType =
typeFilter === "" || item.reportType === typeFilter;

const reportStatus = item.status || "OPEN";

const matchStatus =
statusFilter === "" ||
reportStatus === statusFilter;

return matchSearch && matchDate && matchType && matchStatus;

});

renderReports(filtered);

};

window.downloadExcel = function(){

if(allReports.length === 0){
alert("No reports available to export.");
return;
}

let table = `
<table border="1">
<tr>
<th>Report ID</th>
<th>Title</th>
<th>Name</th>
<th>Date</th>
<th>Flight Number</th>
<th>Aircraft Registration</th>
<th>Airport</th>
<th>Destination</th>
<th>Type Report</th>
<th>What Happened</th>
<th>Recommendation</th>
<th>Risk</th>
<th>Risk Level</th>
<th>Residual Risk</th>
<th>Residual Level</th>
</tr>
`;

allReports.forEach(report=>{

const item = report.item;

const riskLevel =
item.riskClosed === true ? getRiskText(item.risk) : "NOT ASSESSED";

const residualLevel =
item.residualRiskClosed === true ? getRiskText(item.residualRisk) : "NOT ASSESSED";

table += `
<tr>
<td>${item.reportId || "N/A"}</td>
<td>${item.title || "N/A"}</td>
<td>${item.reporterName || "N/A"}</td>
<td>${item.date || "N/A"}</td>
<td>${item.flightNumber || "N/A"}</td>
<td>${item.aircraftRegistration || "N/A"}</td>
<td>${item.airport || "N/A"}</td>
<td>${item.destination || "N/A"}</td>
<td>${item.reportType || "N/A"}</td>
<td>${item.whatHappened || "N/A"}</td>
<td>${item.recommendation || "N/A"}</td>
<td>${item.risk || "N/A"}</td>
<td>${riskLevel}</td>
<td>${item.residualRisk || "N/A"}</td>
<td>${residualLevel}</td>
</tr>
`;

});

table += `</table>`;

const blob = new Blob([table], {
type: "application/vnd.ms-excel"
});

const url = URL.createObjectURL(blob);

const a = document.createElement("a");

a.href = url;

a.download = "SMS_Database_Export.xls";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

URL.revokeObjectURL(url);

};
