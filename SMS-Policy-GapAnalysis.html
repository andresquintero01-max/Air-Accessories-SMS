<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Gap Analysis</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1450px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
}

.header{text-align:center;margin-bottom:42px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

h1{
  font-size:54px;
  color:#003b66;
  font-weight:900;
}

.subtitle{
  color:#536172;
  font-size:19px;
  font-weight:600;
  margin-top:10px;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.summary-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:24px;
  padding:24px;
  border:1px solid #e6eef5;
  border-top:8px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  text-align:center;
}

.summary-card h2{
  color:#003b66;
  font-size:38px;
  font-weight:900;
}

.summary-card p{
  color:#536172;
  font-weight:900;
  margin-top:6px;
}

.progress-box{
  background:white;
  padding:28px;
  border-radius:28px;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  margin-bottom:35px;
  border:1px solid #e6eef5;
  border-left:8px solid #00aeef;
}

.progress-title{
  color:#003b66;
  font-size:26px;
  font-weight:900;
  margin-bottom:14px;
}

.progress-track{
  width:100%;
  height:22px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#dc2626,#f59e0b,#16a34a);
  transition:width .8s ease;
}

.progress-text{
  margin-top:12px;
  color:#003b66;
  font-weight:900;
}

.section{
  margin-bottom:34px;
}

.section-title{
  background:linear-gradient(135deg,#003b66,#005f99);
  color:white;
  padding:18px 24px;
  border-radius:20px;
  font-size:24px;
  font-weight:900;
  margin-bottom:18px;
  box-shadow:0 12px 26px rgba(0,0,0,.18);
}

.question-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:26px;
  padding:26px;
  margin-bottom:20px;
  border:1px solid #e6eef5;
  border-top:8px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
}

.question-card h3{
  color:#003b66;
  font-size:22px;
  margin-bottom:10px;
}

.ref{
  display:inline-block;
  background:#ecfeff;
  color:#003b66;
  padding:7px 14px;
  border-radius:999px;
  font-weight:900;
  margin-bottom:14px;
  font-size:13px;
}

.question{
  color:#071f47;
  font-size:16px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.full{grid-column:1/3;}

label{
  color:#003b66;
  font-weight:900;
  display:block;
  margin-bottom:7px;
}

select,input,textarea{
  width:100%;
  padding:14px;
  border:1px solid #cfd8e3;
  border-radius:14px;
  font-size:14px;
  background:white;
  font-family:'Segoe UI',Arial,sans-serif;
  outline:none;
}

textarea{
  min-height:80px;
  resize:vertical;
}

select:focus,input:focus,textarea:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
}

.status-compliant{border-top-color:#16a34a;}
.status-partial{border-top-color:#f59e0b;}
.status-not{border-top-color:#dc2626;}
.status-na{border-top-color:#64748b;}

.buttons{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:35px;
  flex-wrap:wrap;
}
  .block-buttons{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:24px 0 34px;
  flex-wrap:wrap;
}

.block-buttons button{
  padding:13px 24px;
  font-size:15px;
}

button{
  border:none;
  color:white;
  padding:16px 30px;
  border-radius:16px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

button:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.save-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.print-btn{
  background:linear-gradient(135deg,#111827,#374151);
}

.back-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.home-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:850px){
  body{padding:25px;}
  .container{padding:35px 22px;border-radius:28px;}
  h1{font-size:38px;}
  .grid{grid-template-columns:1fr;}
  .full{grid-column:1;}
}

@media print{
  body{background:white;padding:10px;}
  .buttons{display:none;}
  .container{box-shadow:none;padding:15px;}
  .question-card{break-inside:avoid;}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">📊</div>
  <div class="company-label">371Q Virtual Professional Safety Office</div>
  <h1>SMS Gap Analysis</h1>
  <div class="subtitle">14 CFR Part 5 Safety Management System Compliance Checklist</div>
  <div class="title-line"></div>
</div>

<div class="summary">
  <div class="summary-card">
    <h2 id="totalCount">0</h2>
    <p>TOTAL QUESTIONS</p>
  </div>
  <div class="summary-card">
    <h2 id="compliantCount">0</h2>
    <p>COMPLIANT</p>
  </div>
  <div class="summary-card">
    <h2 id="partialCount">0</h2>
    <p>PARTIAL</p>
  </div>
  <div class="summary-card">
    <h2 id="notCount">0</h2>
    <p>NOT COMPLIANT</p>
  </div>
</div>

<div class="progress-box">
  <div class="progress-title">Overall SMS Compliance</div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">0% Complete</div>
</div>

<div id="gapContainer"></div>

<div class="buttons">
  <button class="save-btn" onclick="saveGapAnalysis()">💾 Save Gap Analysis</button>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
  <button class="back-btn" onclick="window.location.href='SMS-Policy.html'">← Back</button>
  <button class="home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
</div>

<div class="footer">
  371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const gapPath = "smsPolicyGapAnalysis";

const questions = [
  {s:"SUBPART A - GENERAL", r:"§5.1", q:"Has the organization determined whether 14 CFR Part 5 applies to its operation or whether the SMS is being implemented voluntarily?"},
  {s:"SUBPART A - GENERAL", r:"§5.3", q:"Has the organization established an SMS that is appropriate to the size, scope, and complexity of its operation?"},
  {s:"SUBPART A - GENERAL", r:"§5.5", q:"Are SMS definitions and terminology understood and consistently used throughout the organization?"},
  {s:"SUBPART A - GENERAL", r:"§5.17", q:"Has the organization documented its system description, including processes, interfaces, and operational activities?"},
  {s:"SUBPART A - GENERAL", r:"§5.19", q:"Has an SMS implementation plan been developed and maintained where applicable?"},

  {s:"SUBPART B - SAFETY POLICY", r:"§5.21", q:"Has the organization established a written safety policy?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.21", q:"Does the safety policy include the organization's safety objectives?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.21", q:"Is the safety policy signed by the accountable executive?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.21", q:"Is the safety policy communicated throughout the organization?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.21", q:"Is the safety policy reviewed regularly to ensure it remains relevant and appropriate?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.23", q:"Does the safety policy define accountability for the accountable executive?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.23", q:"Does the organization define safety accountability for management personnel?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.23", q:"Are employees aware of their responsibilities related to safety performance?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.23", q:"Are levels of management authorized to make safety risk acceptance decisions clearly identified?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.25", q:"Has an accountable executive been formally identified?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.25", q:"Does the accountable executive have final authority over operations and safety resources?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.25", q:"Has a qualified person been assigned responsibility for managing SMS implementation and performance?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.25", q:"Does the assigned SMS manager monitor the effectiveness of SMS processes?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.27", q:"Has emergency response planning been coordinated with the SMS?"},
  {s:"SUBPART B - SAFETY POLICY", r:"§5.27", q:"Are emergency response responsibilities, coordination, and communication processes documented?"},

  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.51", q:"Does the organization apply Safety Risk Management when developing new systems?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.51", q:"Does the organization apply SRM when revising existing systems or operational processes?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.51", q:"Does the organization apply SRM when developing new operational procedures?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.53", q:"Does the organization perform system analysis to identify hazards?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.53", q:"Are hazards identified through employee reports, audits, investigations, and operational data?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.53", q:"Are identified hazards documented in a hazard or risk register?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.55", q:"Does the organization analyze safety risk associated with identified hazards?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.55", q:"Does the organization assess safety risk using defined severity and likelihood criteria?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.55", q:"Are risk acceptance criteria clearly defined?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.55", q:"Are safety risk controls developed and implemented when required?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.55", q:"Are safety risk controls evaluated before implementation?"},
  {s:"SUBPART C - SAFETY RISK MANAGEMENT", r:"§5.57", q:"Does the organization notify interfacing persons or organizations of hazards when applicable?"},

  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.71", q:"Does the organization monitor operational processes to identify safety performance issues?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.71", q:"Does the organization collect data to monitor safety performance?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.71", q:"Does the organization analyze safety data to identify trends or hazards?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.71", q:"Are audits, evaluations, or inspections used to monitor SMS performance?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.71", q:"Are employee safety reports reviewed and analyzed as part of safety assurance?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.73", q:"Does the organization assess whether safety risk controls are effective?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.73", q:"Are safety objectives and safety performance targets reviewed periodically?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.73", q:"Are ineffective risk controls identified and returned to SRM when needed?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.73", q:"Are new hazards identified through monitoring activities entered into SRM?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.75", q:"Does the organization have a process for continuous improvement of the SMS?"},
  {s:"SUBPART D - SAFETY ASSURANCE", r:"§5.75", q:"Are corrective actions tracked until completion and effectiveness review?"},

  {s:"SUBPART E - SAFETY PROMOTION", r:"§5.91", q:"Has the organization established SMS training for personnel?"},
  {s:"SUBPART E - SAFETY PROMOTION", r:"§5.91", q:"Is SMS training appropriate to each employee's duties and responsibilities?"},
  {s:"SUBPART E - SAFETY PROMOTION", r:"§5.91", q:"Are accountable executive and management personnel trained on SMS responsibilities?"},
  {s:"SUBPART E - SAFETY PROMOTION", r:"§5.91", q:"Are training records maintained?"},
  {s:"SUBPART E - SAFETY PROMOTION", r:"§5.93", q:"Does the organization communicate safety information throughout the organization?"},
  {s:"SUBPART E - SAFETY PROMOTION", r:"§5.93", q:"Are safety bulletins, meetings, alerts, or lessons learned used to promote safety awareness?"},
  {s:"SUBPART E - SAFETY PROMOTION", r:"§5.93", q:"Are employees informed of SMS outputs such as hazards, risk controls, and safety performance results?"},

  {s:"SUBPART F - SMS DOCUMENTATION AND RECORDKEEPING", r:"§5.95", q:"Does the organization maintain SMS documentation describing SMS processes and procedures?"},
  {s:"SUBPART F - SMS DOCUMENTATION AND RECORDKEEPING", r:"§5.95", q:"Does SMS documentation include safety policy, accountabilities, SRM, safety assurance, and promotion processes?"},
  {s:"SUBPART F - SMS DOCUMENTATION AND RECORDKEEPING", r:"§5.97", q:"Are SMS records retained to demonstrate implementation and performance of the SMS?"},
  {s:"SUBPART F - SMS DOCUMENTATION AND RECORDKEEPING", r:"§5.97", q:"Are records maintained for safety risk management outputs, safety assurance activities, training, and communications?"},
  {s:"SUBPART F - SMS DOCUMENTATION AND RECORDKEEPING", r:"§5.97", q:"Are records accessible for review, audits, and management oversight?"}
];

function renderQuestions(saved = {}){
  const container = document.getElementById("gapContainer");
  container.innerHTML = "";

  const sections = {};

  questions.forEach((item,index)=>{
    if(!sections[item.s]) sections[item.s] = [];
    sections[item.s].push({...item,index:index});
  });

  Object.keys(sections).forEach(section=>{
    const div = document.createElement("div");
    div.className = "section";

    let html = `<div class="section-title">${section}</div>`;

    sections[section].forEach((item,blockIndex)=>{
      const data = saved[item.index] || {};
      const statusClass =
        data.status === "COMPLIANT" ? "status-compliant" :
        data.status === "PARTIAL" ? "status-partial" :
        data.status === "NOT COMPLIANT" ? "status-not" :
        data.status === "N/A" ? "status-na" : "";

      html += `
      <div class="question-card ${statusClass}" id="card-${item.index}">
        <span class="ref">${item.r}</span>
        <h3>Question ${item.index + 1}</h3>
        <div class="question">${item.q}</div>

        <div class="grid">
          <div>
            <label>Compliance Status</label>
            <select id="status-${item.index}" onchange="updateSummary()">
              <option value="">Select Status</option>
              <option value="COMPLIANT" ${data.status==="COMPLIANT"?"selected":""}>Compliant</option>
              <option value="PARTIAL" ${data.status==="PARTIAL"?"selected":""}>Partially Compliant</option>
              <option value="NOT COMPLIANT" ${data.status==="NOT COMPLIANT"?"selected":""}>Not Compliant</option>
              <option value="N/A" ${data.status==="N/A"?"selected":""}>Not Applicable</option>
            </select>
          </div>

          <div>
            <label>Responsible Person</label>
            <input id="responsible-${item.index}" value="${data.responsible || ""}" placeholder="Responsible">
          </div>

          <div>
            <label>Target Date</label>
            <input type="date" id="target-${item.index}" value="${data.targetDate || ""}">
          </div>

          <div>
            <label>CPA Required</label>
            <select id="cpa-${item.index}">
              <option value="NO" ${data.cpaRequired==="NO"?"selected":""}>No</option>
              <option value="YES" ${data.cpaRequired==="YES"?"selected":""}>Yes</option>
            </select>
          </div>

          <div class="full">
            <label>Evidence / Link</label>
            <input id="evidence-${item.index}" value="${data.evidence || ""}" placeholder="Paste evidence link or document reference">
          </div>

          <div class="full">
            <label>Observation / Gap</label>
            <textarea id="observation-${item.index}" placeholder="Write observation or gap">${data.observation || ""}</textarea>
          </div>

          <div class="full">
            <label>Action Required</label>
            <textarea id="action-${item.index}" placeholder="Write required action">${data.actionRequired || ""}</textarea>
          </div>
        </div>
      </div>
            `;

      if((blockIndex + 1) % 4 === 0 || blockIndex === sections[section].length - 1){
        const startIndex = item.index - (blockIndex % 4);
        const endIndex = item.index;

        html += `
        <div class="block-buttons">
          <button class="save-btn" onclick="saveGapBlock(${startIndex},${endIndex})">💾 Save This Block</button>
          <button class="back-btn" onclick="window.location.href='SMS-Policy.html'">← Back</button>
          <button class="home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
        </div>
        `;
      }
    });

    div.innerHTML = html;
    container.appendChild(div);
  });

  updateSummary();
}

window.updateSummary = function(){
  let compliant = 0;
  let partial = 0;
  let notCompliant = 0;
  let applicable = 0;

  questions.forEach((q,index)=>{
    const status = document.getElementById("status-" + index)?.value || "";
    const card = document.getElementById("card-" + index);

    if(card){
      card.classList.remove("status-compliant","status-partial","status-not","status-na");

      if(status === "COMPLIANT") card.classList.add("status-compliant");
      if(status === "PARTIAL") card.classList.add("status-partial");
      if(status === "NOT COMPLIANT") card.classList.add("status-not");
      if(status === "N/A") card.classList.add("status-na");
    }

    if(status !== "" && status !== "N/A") applicable++;
    if(status === "COMPLIANT") compliant++;
    if(status === "PARTIAL") partial++;
    if(status === "NOT COMPLIANT") notCompliant++;
  });

  const percent = applicable === 0 ? 0 : Math.round(((compliant + partial * 0.5) / applicable) * 100);

  document.getElementById("totalCount").innerText = questions.length;
  document.getElementById("compliantCount").innerText = compliant;
  document.getElementById("partialCount").innerText = partial;
  document.getElementById("notCount").innerText = notCompliant;
  document.getElementById("progressText").innerText = percent + "% Complete";
  document.getElementById("progressFill").style.width = percent + "%";
};
function collectGapItem(index){
  const q = questions[index];

  return {
    section:q.s,
    reference:q.r,
    question:q.q,
    status:document.getElementById("status-" + index).value,
    responsible:document.getElementById("responsible-" + index).value,
    targetDate:document.getElementById("target-" + index).value,
    cpaRequired:document.getElementById("cpa-" + index).value,
    evidence:document.getElementById("evidence-" + index).value,
    observation:document.getElementById("observation-" + index).value,
    actionRequired:document.getElementById("action-" + index).value
  };
}

window.saveGapBlock = async function(startIndex,endIndex){
  const snapshot = await get(ref(db,gapPath));
  const current = snapshot.exists() && snapshot.val().items ? snapshot.val().items : {};

  for(let i=startIndex;i<=endIndex;i++){
    current[i] = collectGapItem(i);
  }

  set(ref(db,gapPath),{
    updatedAt:new Date().toLocaleString(),
    items:current
  }).then(()=>{
    alert("Questions " + (startIndex + 1) + " to " + (endIndex + 1) + " saved successfully.");
  });
};
window.saveGapAnalysis = function(){
  const data = {};

  questions.forEach((q,index)=>{
    data[index] = {
      section:q.s,
      reference:q.r,
      question:q.q,
      status:document.getElementById("status-" + index).value,
      responsible:document.getElementById("responsible-" + index).value,
      targetDate:document.getElementById("target-" + index).value,
      cpaRequired:document.getElementById("cpa-" + index).value,
      evidence:document.getElementById("evidence-" + index).value,
      observation:document.getElementById("observation-" + index).value,
      actionRequired:document.getElementById("action-" + index).value
    };
  });

  set(ref(db,gapPath),{
    updatedAt:new Date().toLocaleString(),
    items:data
  }).then(()=>{
    alert("SMS Gap Analysis saved successfully.");
  });
};

function loadSaved(){
  get(ref(db,gapPath)).then(snapshot=>{
    if(snapshot.exists()){
      const saved = snapshot.val().items || {};
      renderQuestions(saved);
    }else{
      renderQuestions();
    }
  });
}

loadSaved();
</script>

</body>
</html>
