<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Report</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "index.html";
    return;
  }

  const snapshot = await get(child(ref(db), "users/" + user.uid));

  if(snapshot.exists()){
    const role = (snapshot.val().role || "").toLowerCase().trim();

    if(role === "tech" || role === "technician"){
      document.getElementById("smsDatabaseBtn").style.display = "none";
    }
  }
});

window.sendReport = function () {

  const title = document.getElementById("title").value.trim();

  if (!title) {
    alert("The Title is required");
    document.getElementById("title").focus();
    return;
  }

  const user = auth.currentUser;

  if(!user){
    alert("User not authenticated. Please log in again.");
    window.location.href = "index.html";
    return;
  }

  const newRef = push(ref(db, "smsReports"));

  set(newRef, {
    reportId: Date.now(),
    title: title,
    reporterName: document.getElementById("name").value,
    date: document.getElementById("date").value,
    createdByUid: user.uid,
    createdByEmail: user.email,
    flightNumber: document.getElementById("flightNumber").value,
    aircraftRegistration: document.getElementById("aircraftRegistration").value,
    airport: document.getElementById("airport").value,
    destination: document.getElementById("destination").value,
    reportType: document.getElementById("reportType").value,
    whatHappened: document.getElementById("what").value,
    recommendation: document.getElementById("recommendation").value,
    status: "OPEN",
    risk: "NOT ASSESSED",
    timestamp: new Date().toISOString()
  })
  .then(() => {

    alert("SMS Report Saved Successfully!");

    document.querySelectorAll("input, textarea, select").forEach(field => {
      field.value = "";
    });

    document.getElementById("title").focus();

  })
  .catch((error) => {
    alert("Error Saving Report: " + error.message);
  });

};
</script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI', Arial, sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(255,152,0,0.30), transparent 30%),
    radial-gradient(circle at bottom right, rgba(28,99,219,0.42), transparent 38%),
    linear-gradient(rgba(5,20,55,0.86), rgba(5,20,55,0.94)),
    url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  width:100%;
  max-width:1150px;
  margin:auto;
  background:rgba(255,255,255,0.97);
  backdrop-filter:blur(14px);
  padding:55px;
  border-radius:38px;
  box-shadow:0 28px 70px rgba(0,0,0,0.38);
  position:relative;
  overflow:hidden;
  animation:fadeIn 0.8s ease;
}

.container::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle,rgba(20,80,184,0.16),transparent 70%);
  top:-170px;
  right:-120px;
}

.container::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:radial-gradient(circle,rgba(255,152,0,0.18),transparent 70%);
  bottom:-150px;
  left:-120px;
}

.content{
  position:relative;
  z-index:2;
}

.header{
  text-align:center;
  margin-bottom:48px;
}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#071f47,#1450b8,#ff9800);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:44px;
  box-shadow:0 16px 34px rgba(0,0,0,0.28);
}

.company{
  color:#1450b8;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  background:#eff6ff;
  color:#071f47;
  padding:10px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.8px;
  margin-bottom:16px;
}

h1{
  text-align:center;
  color:#071f47;
  font-size:56px;
  margin-bottom:12px;
  font-weight:900;
  line-height:1.1;
}

.subtitle{
  text-align:center;
  color:#536172;
  font-size:19px;
  font-weight:600;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 42px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#ff9800,#1450b8,transparent);
}

.form-card{
  background:linear-gradient(135deg,#ffffff,#f8fbff);
  border-radius:28px;
  padding:36px;
  box-shadow:0 14px 30px rgba(0,0,0,0.11);
  border:1px solid #e6eef5;
  border-top:9px solid #ff9800;
  position:relative;
  overflow:hidden;
}

.form-card::before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(255,152,0,0.09);
  top:-65px;
  right:-55px;
}

.grid,
.buttons{
  position:relative;
  z-index:2;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.full{
  grid-column:1 / 3;
}

label{
  font-weight:900;
  display:block;
  margin-bottom:8px;
  color:#071f47;
  font-size:17px;
}

input,
textarea,
select{
  width:100%;
  padding:16px;
  border:1px solid #d4dbe8;
  border-radius:15px;
  font-size:17px;
  font-family:'Segoe UI', Arial, sans-serif;
  outline:none;
  background:#f8fbff;
  transition:0.25s;
}

textarea{
  height:135px;
  resize:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#1450b8;
  box-shadow:0 0 0 4px rgba(20,80,184,0.15);
  background:white;
}

.required{
  color:#dc2626;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:35px;
}

button,
.database-btn,
.home-btn,
.hazard-btn,
.myreports-btn{
  min-height:64px;
  border:none;
  border-radius:16px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.3s;
  color:white;
  box-shadow:0 12px 26px rgba(0,0,0,0.20);
  padding:16px;
}

button{
  background:linear-gradient(135deg,#071f47,#1450b8);
}

.database-btn{
  background:linear-gradient(135deg,#071f47,#1450b8);
}

.home-btn{
  background:linear-gradient(135deg,#ff6b00,#ff9800);
}

.hazard-btn{
  background:linear-gradient(135deg,#047857,#22b573);
}

.myreports-btn{
  background:linear-gradient(135deg,#071f47,#0b2a66);
}

button:hover,
.database-btn:hover,
.home-btn:hover,
.hazard-btn:hover,
.myreports-btn:hover{
  transform:translateY(-4px);
  filter:brightness(1.08);
}

.footer{
  margin-top:38px;
  text-align:center;
  color:#071f47;
  font-size:15px;
  letter-spacing:2px;
  font-weight:900;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:800px){
  body{
    padding:25px;
  }

  .container{
    padding:35px 22px;
    border-radius:28px;
  }

  h1{
    font-size:40px;
  }

  .subtitle{
    font-size:16px;
  }

  .grid,
  .buttons{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:1;
  }
}
</style>
</head>

<body>

<div class="container">
<div class="content">

  <div class="header">
    <div class="logo">📝</div>
    <div class="company">AIR ACCESSORIES & AVIONICS</div>
    <div class="badge">HAZARD REPORTING</div>

    <h1>SMS Report Form</h1>

    <div class="subtitle">
      Aviation Safety Management Reporting System
    </div>

    <div class="title-line"></div>
  </div>

  <div class="form-card">

    <div class="grid">

      <div class="full">
        <label>Title <span class="required">*</span></label>
        <input id="title" type="text" placeholder="Enter report title">
      </div>

      <div>
        <label>Name</label>
        <input id="name" type="text" placeholder="Reporter name">
      </div>

      <div>
        <label>Date</label>
        <input id="date" type="date">
      </div>

      <div>
        <label>Flight Number</label>
        <input id="flightNumber" type="text" placeholder="Example: AV1234">
      </div>

      <div>
        <label>Aircraft Registration</label>
        <input id="aircraftRegistration" type="text" placeholder="Example: N123XX">
      </div>

      <div>
        <label>Airport</label>
        <input id="airport" type="text" placeholder="Example: KOPF, KMIA, KBOS">
      </div>

      <div>
        <label>Destination</label>
        <input id="destination" type="text" placeholder="Destination airport">
      </div>

      <div class="full">
        <label>Type Report</label>
        <select id="reportType">
          <option value="">Select report type</option>
          <option value="MOR">MOR</option>
          <option value="VOR">VOR</option>
        </select>
      </div>

      <div class="full">
        <label>What Happened?</label>
        <textarea id="what" placeholder="Describe what happened"></textarea>
      </div>

      <div class="full">
        <label>Recommendation to Prevent Recurrence</label>
        <textarea id="recommendation" placeholder="Write a simple recommendation to avoid this event again"></textarea>
      </div>

    </div>

    <div class="buttons">

      <button type="button" onclick="sendReport()">
        ✅ Send Report
      </button>

      <a class="database-btn" id="smsDatabaseBtn" href="SMS-Database.html">
        📊 SMS Database
      </a>

      <a class="home-btn" href="index.html">
        🏠 Home
      </a>

      <a class="hazard-btn" href="Hazard-Identification.html">
        ⚠️ Hazard Identification
      </a>

      <a class="myreports-btn" href="My-Reports.html">
        📋 My Reports
      </a>

    </div>

  </div>

  <div class="footer">
    371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
  </div>

</div>
</div>

</body>
</html>
