<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Policy Calendar</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1350px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
}

.header{text-align:center;margin-bottom:42px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

h1{
  font-size:54px;
  color:#003b66;
  font-weight:900;
}

.subtitle{
  color:#536172;
  font-size:19px;
  font-weight:600;
  margin-top:10px;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.quick-panel{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  padding:30px;
  border-radius:28px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  margin-bottom:30px;
}

.quick-panel h2{
  color:#003b66;
  font-size:28px;
  margin-bottom:18px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

button{
  border:none;
  color:white;
  padding:15px;
  border-radius:15px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

button:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.quick-btn{
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
}

.calendar-section{
  margin-top:30px;
}

.section-title{
  background:linear-gradient(135deg,#003b66,#005f99);
  color:white;
  padding:18px 24px;
  border-radius:20px;
  font-size:24px;
  font-weight:900;
  margin-bottom:18px;
  box-shadow:0 12px 26px rgba(0,0,0,.18);
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:22px;
}

.calendar-card{
  background:white;
  border-radius:26px;
  padding:24px;
  box-shadow:0 14px 30px rgba(0,0,0,.12);
  border:1px solid #e6eef5;
  border-top:8px solid #dc2626;
}

.calendar-card.completed{
  border-top:8px solid #16a34a;
}

.status{
  display:inline-block;
  padding:8px 16px;
  border-radius:999px;
  color:white;
  font-size:13px;
  font-weight:900;
  margin-bottom:14px;
}

.open-status{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.completed-status{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.calendar-card h3{
  color:#003b66;
  font-size:24px;
  margin-bottom:12px;
}

.info{
  color:#536172;
  line-height:1.7;
  font-size:15px;
  margin-bottom:14px;
}

.date-editor{
  background:#f8fcff;
  padding:16px;
  border-radius:18px;
  border-left:5px solid #00aeef;
  margin:14px 0;
}

.date-editor label{
  color:#003b66;
  font-weight:900;
  display:block;
  margin-bottom:8px;
}

.date-editor input{
  width:100%;
  padding:13px;
  border-radius:13px;
  border:1px solid #cfd8e3;
  font-size:15px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

.completed-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.update-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}
  .edit-date-btn{
  background:linear-gradient(135deg,#d97706,#f59e0b);
}

.reopen-btn{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.delete-btn{
  background:linear-gradient(135deg,#475569,#64748b);
}

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:40px;
  flex-wrap:wrap;
}

.back-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.home-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

.empty{
  background:white;
  padding:30px;
  border-radius:24px;
  color:#536172;
  font-weight:900;
  text-align:center;
}

@media(max-width:850px){
  body{padding:25px;}
  .container{padding:35px 22px;border-radius:28px;}
  h1{font-size:40px;}
  .actions{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">📅</div>
  <div class="company-label">371Q Virtual Professional Safety Office</div>
  <h1>SMS Policy Calendar</h1>
  <div class="subtitle">SMS Compliance Calendar, Meetings and Policy Reminders</div>
  <div class="title-line"></div>
</div>

<div class="quick-panel">
  <h2>Quick Add Calendar Item</h2>

  <div class="quick-grid">
    <button class="quick-btn" onclick="quickAdd('Monthly Safety Bulletin','MONTHLY','Bulletin')">Monthly Safety Bulletin</button>
    <button class="quick-btn" onclick="quickAdd('SAG Meeting','BIMONTHLY','Meeting')">Bi-Monthly SAG Meeting</button>
    <button class="quick-btn" onclick="quickAdd('SRB Meeting','QUARTERLY','Meeting')">Quarterly SRB Meeting</button>
    <button class="quick-btn" onclick="quickAdd('SMS Policy Review','ANNUAL','Policy')">Annual SMS Policy Review</button>
    <button class="quick-btn" onclick="quickAdd('Safety Objectives Review','ANNUAL','Objective')">Annual Objectives Review</button>
    <button class="quick-btn" onclick="quickAdd('Emergency Response Plan Review','ANNUAL','Emergency Response')">Annual ERP Review</button>
  </div>
</div>

<div id="calendarContainer"></div>

<div class="bottom-buttons">
  <button class="back-btn" onclick="window.location.href='SMS-Policy.html'">← Back to SMS Policy</button>
  <button class="home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
</div>

<div class="footer">
  371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const calendarPath = "smsPolicyCalendar";
  let allCalendarItems = {};

function todayISO(){
  return new Date().toISOString().split("T")[0];
}

function addMonths(dateString, months){
  const date = new Date(dateString + "T00:00:00");
  date.setMonth(date.getMonth() + months);
  return date.toISOString().split("T")[0];
}

function nextDate(date, frequency){
  if(frequency === "MONTHLY") return addMonths(date,1);
  if(frequency === "BIMONTHLY") return addMonths(date,2);
  if(frequency === "QUARTERLY") return addMonths(date,3);
  if(frequency === "SEMIANNUAL") return addMonths(date,6);
  if(frequency === "ANNUAL") return addMonths(date,12);
  return date;
}

window.quickAdd = function(title, frequency, category){

  const existingItems = Object.values(allCalendarItems || {}).filter(item =>
    item.title === title &&
    item.frequency === frequency
  );

  let dueDate = todayISO();

  if(existingItems.length > 0){

    existingItems.sort((a,b)=>{
      return (a.dueDate || "").localeCompare(b.dueDate || "");
    });

    const lastItem = existingItems[existingItems.length - 1];

    dueDate = nextDate(lastItem.dueDate, frequency);
  }

  const newRef = push(ref(db, calendarPath));

  set(newRef,{
    title:title,
    frequency:frequency,
    category:category,
    dueDate:dueDate,
    status:"OPEN",
    createdAt:new Date().toLocaleString(),
    updatedAt:new Date().toLocaleString()
  });

};

window.markCompleted = function(key){
  update(ref(db, calendarPath + "/" + key),{
    status:"COMPLETED",
    completedAt:new Date().toLocaleString(),
    updatedAt:new Date().toLocaleString()
  });
};

window.reopenItem = function(key){
  update(ref(db, calendarPath + "/" + key),{
    status:"OPEN",
    updatedAt:new Date().toLocaleString()
  });
};

window.updateDate = function(key){
  const newDate = document.getElementById("date-" + key).value;

  if(!newDate){
    alert("Please select a date.");
    return;
  }

  update(ref(db, calendarPath + "/" + key),{
    dueDate:newDate,
    updatedAt:new Date().toLocaleString()
  });
};

window.moveNext = function(key, currentDate, frequency){
  update(ref(db, calendarPath + "/" + key),{
    dueDate:nextDate(currentDate, frequency),
    status:"OPEN",
    updatedAt:new Date().toLocaleString()
  });
};

window.deleteItem = function(key){
  if(!confirm("Delete this calendar item?")) return;
  remove(ref(db, calendarPath + "/" + key));
};

function sectionName(freq){
  if(freq === "MONTHLY") return "MONTHLY ITEMS";
  if(freq === "BIMONTHLY") return "BI-MONTHLY ITEMS";
  if(freq === "QUARTERLY") return "QUARTERLY ITEMS";
  if(freq === "SEMIANNUAL") return "SEMIANNUAL ITEMS";
  if(freq === "ANNUAL") return "ANNUAL ITEMS";
  return "ONE TIME ITEMS";
}

function renderCard(key,item){
  const completed = item.status === "COMPLETED";

  return `
    <div class="calendar-card ${completed ? "completed" : ""}">
      <span class="status ${completed ? "completed-status" : "open-status"}">
        ${completed ? "COMPLETED" : "OPEN"}
      </span>

      <h3>${item.title || "N/A"}</h3>

      <div class="info">
        <b>Category:</b> ${item.category || "N/A"}<br>
        <b>Frequency:</b> ${item.frequency || "N/A"}<br>
        <b>Due Date:</b> ${item.dueDate || "N/A"}
      </div>

      <div class="date-editor">
        <label>Edit Due Date</label>
        <input type="date" id="date-${key}" value="${item.dueDate || ""}">
      </div>

      <div class="actions">
        <button class="edit-date-btn" onclick="updateDate('${key}')">Update Date</button>

        ${
          completed
          ? `<button class="reopen-btn" onclick="reopenItem('${key}')">Reopen</button>`
          : `<button class="completed-btn" onclick="markCompleted('${key}')">Mark Completed</button>`
        }

        <button class="update-btn" onclick="moveNext('${key}','${item.dueDate}','${item.frequency}')">Next Due</button>
        <button class="delete-btn" onclick="deleteItem('${key}')">Delete</button>
      </div>
    </div>
  `;
}

function loadCalendar(){
  onValue(ref(db, calendarPath), snapshot => {
    const container = document.getElementById("calendarContainer");
    container.innerHTML = "";

    if(!snapshot.exists()){
      container.innerHTML = `<div class="empty">No calendar items created yet.</div>`;
      return;
    }

    const data = snapshot.val();
    allCalendarItems = data;

    const groups = {
      MONTHLY:[],
      BIMONTHLY:[],
      QUARTERLY:[],
      SEMIANNUAL:[],
      ANNUAL:[],
      ONETIME:[]
    };

    Object.entries(data).forEach(([key,item])=>{
      const freq = item.frequency || "ONETIME";
      if(!groups[freq]) groups[freq] = [];
      groups[freq].push([key,item]);
    });

    Object.keys(groups).forEach(freq=>{
      if(groups[freq].length === 0) return;

      groups[freq].sort((a,b)=>{
        return String(a[1].dueDate || "").localeCompare(String(b[1].dueDate || ""));
      });

      const section = document.createElement("div");
      section.className = "calendar-section";

      let html = `
        <div class="section-title">${sectionName(freq)}</div>
        <div class="calendar-grid">
      `;

      groups[freq].forEach(([key,item])=>{
        html += renderCard(key,item);
      });

      html += `</div>`;

      section.innerHTML = html;
      container.appendChild(section);
    });
  });
}

loadCalendar();
</script>

</body>
</html>
