<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Policy Calendar</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1350px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
}

.header{text-align:center;margin-bottom:42px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

h1{
  font-size:54px;
  color:#003b66;
  font-weight:900;
}

.subtitle{
  color:#536172;
  font-size:19px;
  font-weight:600;
  margin-top:10px;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.quick-panel{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  padding:30px;
  border-radius:28px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  margin-bottom:30px;
}

.quick-panel h2{
  color:#003b66;
  font-size:28px;
  margin-bottom:18px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

button{
  border:none;
  color:white;
  padding:16px;
  border-radius:16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

button:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.quick-btn{
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
}

.calendar-board{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:24px;
}

.task-card{
  background:white;
  border-radius:28px;
  padding:28px;
  box-shadow:0 16px 35px rgba(0,0,0,.13);
  border:1px solid #e6eef5;
  position:relative;
  overflow:hidden;
}

.task-card::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  top:-70px;
  right:-60px;
  opacity:.12;
}

.task-open{
  border-top:9px solid #dc2626;
}

.task-open::before{
  background:#dc2626;
}

.task-completed{
  border-top:9px solid #16a34a;
}

.task-completed::before{
  background:#16a34a;
}

.status-badge{
  display:inline-block;
  padding:9px 18px;
  border-radius:999px;
  color:white;
  font-size:13px;
  font-weight:900;
  margin-bottom:18px;
}

.open-badge{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.completed-badge{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.task-card h2{
  color:#003b66;
  font-size:26px;
  margin-bottom:12px;
  position:relative;
  z-index:2;
}

.task-card p{
  color:#536172;
  font-size:16px;
  line-height:1.6;
  margin-bottom:12px;
  position:relative;
  z-index:2;
}

.date-box{
  background:#f8fcff;
  padding:14px;
  border-radius:16px;
  color:#003b66;
  font-weight:900;
  margin:16px 0;
  border-left:5px solid #00aeef;
  position:relative;
  z-index:2;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
  position:relative;
  z-index:2;
}

.complete-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.reopen-btn{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.delete-btn{
  background:linear-gradient(135deg,#475569,#64748b);
}

.form-panel{
  margin-top:30px;
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  padding:30px;
  border-radius:28px;
  border:1px solid #e6eef5;
  border-top:9px solid #003b66;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
}

.form-panel h2{
  color:#003b66;
  font-size:28px;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.full{grid-column:1/4;}

label{
  font-weight:900;
  color:#003b66;
  display:block;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  padding:15px;
  border:1px solid #cfd8e3;
  border-radius:15px;
  font-size:15px;
  outline:none;
  background:#f9fbfd;
  font-family:'Segoe UI',Arial,sans-serif;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.save-btn{
  width:100%;
  margin-top:22px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
}

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:35px;
  flex-wrap:wrap;
}

.back-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.home-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.empty{
  text-align:center;
  padding:40px;
  color:#536172;
  font-size:22px;
  font-weight:900;
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:850px){
  body{padding:25px;}
  .container{padding:35px 22px;border-radius:28px;}
  h1{font-size:40px;}
  .form-grid{grid-template-columns:1fr;}
  .full{grid-column:1;}
  .actions{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">📅</div>
    <div class="company-label">AIR ACCESSORIES & AVIONICS</div>
    <h1>SMS Policy Calendar</h1>
    <div class="subtitle">SMS Compliance Timeline & Reminder Board</div>
    <div class="title-line"></div>
  </div>

  <div class="quick-panel">
    <h2>Quick Create Reminder</h2>

    <div class="quick-grid">
      <button class="quick-btn" onclick="quickAdd('Monthly Safety Bulletin','MONTHLY','Bulletin')">Monthly Safety Bulletin</button>
      <button class="quick-btn" onclick="quickAdd('SAG Meeting','BIMONTHLY','Meeting')">Bi-Monthly SAG Meeting</button>
      <button class="quick-btn" onclick="quickAdd('SRB Meeting','QUARTERLY','Meeting')">Quarterly SRB Meeting</button>
      <button class="quick-btn" onclick="quickAdd('SMS Policy Review','ANNUAL','Policy')">Annual Policy Review</button>
      <button class="quick-btn" onclick="quickAdd('Safety Objectives Review','ANNUAL','Objective')">Annual Objectives Review</button>
      <button class="quick-btn" onclick="quickAdd('Emergency Response Plan Review','ANNUAL','Emergency Response')">Annual ERP Review</button>
    </div>
  </div>

  <div class="calendar-board" id="calendarBoard"></div>

  <div class="form-panel">
    <h2>Create Custom Reminder</h2>

    <div class="form-grid">
      <div>
        <label>Title</label>
        <input id="title" placeholder="Example: Internal Audit Review">
      </div>

      <div>
        <label>Frequency</label>
        <select id="frequency">
          <option value="MONTHLY">Monthly</option>
          <option value="BIMONTHLY">Bi-Monthly</option>
          <option value="QUARTERLY">Quarterly</option>
          <option value="SEMIANNUAL">Semiannual</option>
          <option value="ANNUAL">Annual</option>
          <option value="ONETIME">One Time</option>
        </select>
      </div>

      <div>
        <label>Due Date</label>
        <input type="date" id="dueDate">
      </div>

      <div>
        <label>Category</label>
        <select id="category">
          <option>Policy</option>
          <option>Meeting</option>
          <option>Bulletin</option>
          <option>Objective</option>
          <option>Emergency Response</option>
          <option>Audit</option>
          <option>Training</option>
        </select>
      </div>

      <div>
        <label>Responsible</label>
        <input id="responsible" placeholder="Responsible person">
      </div>

      <div>
        <label>Status</label>
        <select id="status">
          <option value="OPEN">OPEN</option>
          <option value="COMPLETED">COMPLETED</option>
        </select>
      </div>

      <div class="full">
        <label>Notes</label>
        <textarea id="notes" placeholder="Write notes or instructions"></textarea>
      </div>
    </div>

    <button class="save-btn" onclick="saveReminder()">Save Reminder</button>
  </div>

  <div class="bottom-buttons">
    <button class="back-btn" onclick="window.location.href='SMS-Policy.html'">← Back to SMS Policy</button>
    <button class="home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
  </div>

  <div class="footer">
    371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const path = "smsPolicyCalendar";

function todayISO(){
  return new Date().toISOString().split("T")[0];
}

function addMonths(dateString, months){
  const date = new Date(dateString + "T00:00:00");
  date.setMonth(date.getMonth() + months);
  return date.toISOString().split("T")[0];
}

window.quickAdd = function(title,frequency,category){
  const dueDate = todayISO();
  const newRef = push(ref(db,path));

  set(newRef,{
    title:title,
    frequency:frequency,
    category:category,
    dueDate:dueDate,
    responsible:"",
    notes:"",
    status:"OPEN",
    createdAt:new Date().toLocaleString(),
    updatedAt:new Date().toLocaleString()
  });
};

window.saveReminder = function(){
  const title = document.getElementById("title").value.trim();
  const dueDate = document.getElementById("dueDate").value;

  if(!title){
    alert("Please enter a title.");
    return;
  }

  if(!dueDate){
    alert("Please select a due date.");
    return;
  }

  const newRef = push(ref(db,path));

  set(newRef,{
    title:title,
    frequency:document.getElementById("frequency").value,
    dueDate:dueDate,
    category:document.getElementById("category").value,
    responsible:document.getElementById("responsible").value,
    status:document.getElementById("status").value,
    notes:document.getElementById("notes").value,
    createdAt:new Date().toLocaleString(),
    updatedAt:new Date().toLocaleString()
  }).then(()=>{
    document.querySelectorAll("input, textarea").forEach(x=>x.value="");
    document.getElementById("frequency").value="MONTHLY";
    document.getElementById("category").value="Policy";
    document.getElementById("status").value="OPEN";
  });
};

window.markCompleted = function(key){
  update(ref(db,path + "/" + key),{
    status:"COMPLETED",
    completedAt:new Date().toLocaleString(),
    updatedAt:new Date().toLocaleString()
  });
};

window.reopenReminder = function(key){
  update(ref(db,path + "/" + key),{
    status:"OPEN",
    updatedAt:new Date().toLocaleString()
  });
};

window.deleteReminder = function(key){
  if(!confirm("Delete this reminder?")) return;
  remove(ref(db,path + "/" + key));
};

function getNextDue(dueDate,frequency){
  if(frequency === "MONTHLY") return addMonths(dueDate,1);
  if(frequency === "BIMONTHLY") return addMonths(dueDate,2);
  if(frequency === "QUARTERLY") return addMonths(dueDate,3);
  if(frequency === "SEMIANNUAL") return addMonths(dueDate,6);
  if(frequency === "ANNUAL") return addMonths(dueDate,12);
  return dueDate;
}

window.moveNextDue = function(key,dueDate,frequency){
  const nextDate = getNextDue(dueDate,frequency);

  update(ref(db,path + "/" + key),{
    status:"OPEN",
    dueDate:nextDate,
    updatedAt:new Date().toLocaleString()
  });
};

function render(){
  onValue(ref(db,path),(snapshot)=>{
    const board = document.getElementById("calendarBoard");
    board.innerHTML = "";

    if(!snapshot.exists()){
      board.innerHTML = `<div class="empty">No reminders created yet.</div>`;
      return;
    }

    const data = snapshot.val();

    Object.entries(data).forEach(([key,item])=>{
      const completed = item.status === "COMPLETED";
      const card = document.createElement("div");

      card.className = completed ? "task-card task-completed" : "task-card task-open";

      card.innerHTML = `
        <span class="status-badge ${completed ? "completed-badge" : "open-badge"}">
          ${completed ? "COMPLETED" : "OPEN"}
        </span>

        <h2>${item.title || "N/A"}</h2>

        <p><b>Category:</b> ${item.category || "N/A"}</p>
        <p><b>Frequency:</b> ${item.frequency || "N/A"}</p>

        <div class="date-box">
          Due Date: ${item.dueDate || "N/A"}
        </div>

        <p><b>Responsible:</b> ${item.responsible || "N/A"}</p>
        <p><b>Notes:</b> ${item.notes || "N/A"}</p>

        <div class="actions">
          ${
            completed
            ? `<button class="reopen-btn" onclick="reopenReminder('${key}')">Reopen</button>`
            : `<button class="complete-btn" onclick="markCompleted('${key}')">Mark Completed</button>`
          }

          <button class="quick-btn" onclick="moveNextDue('${key}','${item.dueDate}','${item.frequency}')">
            Next Date
          </button>

          <button class="delete-btn" onclick="deleteReminder('${key}')">
            Delete
          </button>
        </div>
      `;

      board.appendChild(card);
    });
  });
}

render();
</script>

</body>
</html>
