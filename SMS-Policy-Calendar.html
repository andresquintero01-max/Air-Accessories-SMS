<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Policy Calendar</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1350px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
}

.header{text-align:center;margin-bottom:42px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  box-shadow:0 16px 34px rgba(0,0,0,.28);
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

h1{
  font-size:54px;
  color:#003b66;
  font-weight:900;
}

.subtitle{
  color:#536172;
  font-size:19px;
  font-weight:600;
  margin-top:10px;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.summary-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:24px;
  padding:24px;
  border:1px solid #e6eef5;
  border-top:8px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  text-align:center;
}

.summary-card h2{
  color:#003b66;
  font-size:38px;
  margin-bottom:6px;
}

.summary-card p{
  color:#536172;
  font-weight:900;
}

.form-card,.list-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:28px;
  padding:32px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  margin-bottom:30px;
}

.form-card h2,.list-card h2{
  color:#003b66;
  font-size:28px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.full{grid-column:1/4;}

label{
  font-weight:900;
  color:#003b66;
  display:block;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  padding:15px;
  border:1px solid #cfd8e3;
  border-radius:15px;
  font-size:15px;
  outline:none;
  background:#f9fbfd;
  font-family:'Segoe UI',Arial,sans-serif;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,select:focus,textarea:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
  background:white;
}

.quick-buttons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
  margin-bottom:24px;
}

button{
  border:none;
  color:white;
  padding:15px 20px;
  border-radius:15px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

button:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.quick-btn,.save-btn{
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
}

.complete-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.delete-btn{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.back-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.home-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.status-overdue{
  border-left:8px solid #dc2626;
}

.status-soon{
  border-left:8px solid #f59e0b;
}

.status-ok{
  border-left:8px solid #16a34a;
}

.status-completed{
  border-left:8px solid #64748b;
}

.reminder-item{
  background:white;
  border-radius:22px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 12px 26px rgba(0,0,0,.10);
  border-top:1px solid #e6eef5;
}

.reminder-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.reminder-title{
  color:#003b66;
  font-size:24px;
  font-weight:900;
}

.badge{
  padding:9px 16px;
  border-radius:999px;
  color:white;
  font-weight:900;
  font-size:13px;
}

.overdue{background:linear-gradient(135deg,#dc2626,#ef4444);}
.soon{background:linear-gradient(135deg,#f59e0b,#facc15);color:#111827;}
.ok{background:linear-gradient(135deg,#16a34a,#22c55e);}
.completed{background:linear-gradient(135deg,#475569,#64748b);}

.reminder-info{
  margin-top:16px;
  color:#071f47;
  line-height:1.8;
  font-size:15px;
}

.actions{
  margin-top:18px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:35px;
  flex-wrap:wrap;
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:850px){
  body{padding:25px;}
  .container{padding:35px 22px;border-radius:28px;}
  h1{font-size:40px;}
  .grid{grid-template-columns:1fr;}
  .full{grid-column:1;}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">📅</div>
    <div class="company-label">AIR ACCESSORIES & AVIONICS</div>
    <h1>SMS Policy Calendar</h1>
    <div class="subtitle">Compliance Reminders, SMS Meetings and Policy Review Tracking</div>
    <div class="title-line"></div>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <h2 id="openCount">0</h2>
      <p>OPEN ITEMS</p>
    </div>
    <div class="summary-card">
      <h2 id="dueSoonCount">0</h2>
      <p>DUE SOON</p>
    </div>
    <div class="summary-card">
      <h2 id="overdueCount">0</h2>
      <p>OVERDUE</p>
    </div>
    <div class="summary-card">
      <h2 id="closedCount">0</h2>
      <p>COMPLETED</p>
    </div>
  </div>

  <div class="form-card">
    <h2>Quick Add SMS Reminder</h2>

    <div class="quick-buttons">
      <button class="quick-btn" onclick="quickReminder('Monthly Safety Bulletin','MONTHLY')">Monthly Safety Bulletin</button>
      <button class="quick-btn" onclick="quickReminder('SRB Meeting','QUARTERLY')">Quarterly SRB Meeting</button>
      <button class="quick-btn" onclick="quickReminder('SAG Meeting','BIMONTHLY')">Bi-Monthly SAG Meeting</button>
      <button class="quick-btn" onclick="quickReminder('SMS Policy Review','ANNUAL')">Annual SMS Policy Review</button>
      <button class="quick-btn" onclick="quickReminder('Safety Objectives Review','ANNUAL')">Annual Objectives Review</button>
      <button class="quick-btn" onclick="quickReminder('Emergency Response Plan Review','ANNUAL')">Annual ERP Review</button>
    </div>

    <div class="grid">
      <div>
        <label>Reminder Title</label>
        <input id="taskTitle" placeholder="Example: Monthly Safety Bulletin">
      </div>

      <div>
        <label>Frequency</label>
        <select id="frequency">
          <option value="MONTHLY">Monthly</option>
          <option value="BIMONTHLY">Bi-Monthly</option>
          <option value="QUARTERLY">Quarterly</option>
          <option value="SEMIANNUAL">Semiannual</option>
          <option value="ANNUAL">Annual</option>
          <option value="ONETIME">One Time</option>
        </select>
      </div>

      <div>
        <label>Next Due Date</label>
        <input type="date" id="dueDate">
      </div>

      <div>
        <label>Responsible Person</label>
        <input id="responsible" placeholder="Responsible person">
      </div>

      <div>
        <label>Status</label>
        <select id="status">
          <option value="OPEN">OPEN</option>
          <option value="COMPLETED">COMPLETED</option>
        </select>
      </div>

      <div>
        <label>Category</label>
        <select id="category">
          <option>Policy</option>
          <option>Meeting</option>
          <option>Bulletin</option>
          <option>Objective</option>
          <option>Emergency Response</option>
          <option>Training</option>
          <option>Audit</option>
        </select>
      </div>

      <div class="full">
        <label>Notes</label>
        <textarea id="notes" placeholder="Add notes or instructions"></textarea>
      </div>
    </div>

    <br>
    <button class="save-btn" onclick="saveReminder()">Save Reminder</button>
  </div>

  <div class="list-card">
    <h2>SMS Calendar Reminders</h2>
    <div id="remindersContainer"></div>
  </div>

  <div class="bottom-buttons">
    <button class="back-btn" onclick="window.location.href='SMS-Policy.html'">← Back to SMS Policy</button>
    <button class="home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
  </div>

  <div class="footer">
    371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const calendarPath = "smsPolicyCalendar";

function todayISO(){
  return new Date().toISOString().split("T")[0];
}

function addMonths(dateString, months){
  const date = new Date(dateString + "T00:00:00");
  date.setMonth(date.getMonth() + months);
  return date.toISOString().split("T")[0];
}

function nextDateByFrequency(date, frequency){
  if(frequency === "MONTHLY") return addMonths(date,1);
  if(frequency === "BIMONTHLY") return addMonths(date,2);
  if(frequency === "QUARTERLY") return addMonths(date,3);
  if(frequency === "SEMIANNUAL") return addMonths(date,6);
  if(frequency === "ANNUAL") return addMonths(date,12);
  return date;
}

window.quickReminder = function(title, frequency){
  document.getElementById("taskTitle").value = title;
  document.getElementById("frequency").value = frequency;
  document.getElementById("status").value = "OPEN";
  document.getElementById("dueDate").value = todayISO();

  if(title.includes("Bulletin")) document.getElementById("category").value = "Bulletin";
  else if(title.includes("Meeting")) document.getElementById("category").value = "Meeting";
  else if(title.includes("Objective")) document.getElementById("category").value = "Objective";
  else if(title.includes("Emergency")) document.getElementById("category").value = "Emergency Response";
  else document.getElementById("category").value = "Policy";
};

window.saveReminder = function(){
  const title = document.getElementById("taskTitle").value.trim();
  const dueDate = document.getElementById("dueDate").value;

  if(!title){
    alert("Please enter a reminder title.");
    return;
  }

  if(!dueDate){
    alert("Please select a due date.");
    return;
  }

  const newRef = push(ref(db,calendarPath));

  set(newRef,{
    title:title,
    frequency:document.getElementById("frequency").value,
    dueDate:dueDate,
    responsible:document.getElementById("responsible").value,
    status:document.getElementById("status").value,
    category:document.getElementById("category").value,
    notes:document.getElementById("notes").value,
    createdAt:new Date().toLocaleString(),
    updatedAt:new Date().toLocaleString()
  }).then(()=>{
    alert("Reminder saved successfully.");
    document.querySelectorAll("input, textarea").forEach(x=>x.value="");
    document.getElementById("frequency").value="MONTHLY";
    document.getElementById("status").value="OPEN";
    document.getElementById("category").value="Policy";
  });
};

function getReminderStatus(item){
  if(item.status === "COMPLETED") return "completed";

  const today = todayISO();
  const due = item.dueDate || today;

  const todayDate = new Date(today + "T00:00:00");
  const dueDate = new Date(due + "T00:00:00");

  const diffDays = Math.ceil((dueDate - todayDate) / (1000 * 60 * 60 * 24));

  if(diffDays < 0) return "overdue";
  if(diffDays <= 15) return "soon";
  return "ok";
}

function statusText(status){
  if(status === "overdue") return "OVERDUE";
  if(status === "soon") return "DUE SOON";
  if(status === "completed") return "COMPLETED";
  return "ON TRACK";
}

window.completeReminder = function(key,dueDate,frequency){
  const nextDue = nextDateByFrequency(dueDate,frequency);

  if(frequency === "ONETIME"){
    update(ref(db,calendarPath + "/" + key),{
      status:"COMPLETED",
      completedAt:new Date().toLocaleString(),
      updatedAt:new Date().toLocaleString()
    });
    return;
  }

  update(ref(db,calendarPath + "/" + key),{
    status:"OPEN",
    dueDate:nextDue,
    lastCompletedAt:new Date().toLocaleString(),
    updatedAt:new Date().toLocaleString()
  }).then(()=>{
    alert("Completed. Next due date was automatically updated.");
  });
};

window.deleteReminder = function(key){
  if(!confirm("Delete this reminder?")) return;
  remove(ref(db,calendarPath + "/" + key));
};

function loadReminders(){
  onValue(ref(db,calendarPath),(snapshot)=>{
    const container = document.getElementById("remindersContainer");
    container.innerHTML = "";

    let open = 0;
    let dueSoon = 0;
    let overdue = 0;
    let closed = 0;

    if(!snapshot.exists()){
      container.innerHTML = "<p style='text-align:center;color:#536172;font-weight:900;'>No reminders created yet.</p>";
      document.getElementById("openCount").innerText = 0;
      document.getElementById("dueSoonCount").innerText = 0;
      document.getElementById("overdueCount").innerText = 0;
      document.getElementById("closedCount").innerText = 0;
      return;
    }

    const data = snapshot.val();

    const list = Object.entries(data).sort((a,b)=>{
      return String(a[1].dueDate || "").localeCompare(String(b[1].dueDate || ""));
    });

    list.forEach(([key,item])=>{
      const s = getReminderStatus(item);

      if(item.status === "COMPLETED") closed++;
      else open++;

      if(s === "soon") dueSoon++;
      if(s === "overdue") overdue++;

      const div = document.createElement("div");
      div.className = "reminder-item status-" + s;

      div.innerHTML = `
        <div class="reminder-top">
          <div>
            <div class="reminder-title">${item.title || "N/A"}</div>
            <div class="reminder-info">
              <b>Category:</b> ${item.category || "N/A"}<br>
              <b>Frequency:</b> ${item.frequency || "N/A"}<br>
              <b>Due Date:</b> ${item.dueDate || "N/A"}<br>
              <b>Responsible:</b> ${item.responsible || "N/A"}<br>
              <b>Notes:</b> ${item.notes || "N/A"}
            </div>
          </div>

          <div class="badge ${s}">
            ${statusText(s)}
          </div>
        </div>

        <div class="actions">
          <button class="complete-btn" onclick="completeReminder('${key}','${item.dueDate}','${item.frequency}')">
            Mark Completed / Move Next Date
          </button>
          <button class="delete-btn" onclick="deleteReminder('${key}')">
            Delete
          </button>
        </div>
      `;

      container.appendChild(div);
    });

    document.getElementById("openCount").innerText = open;
    document.getElementById("dueSoonCount").innerText = dueSoon;
    document.getElementById("overdueCount").innerText = overdue;
    document.getElementById("closedCount").innerText = closed;
  });
}

loadReminders();
</script>

</body>
</html>
