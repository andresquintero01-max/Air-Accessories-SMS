<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Air Accessories Audit Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1450px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:38px;
  padding:45px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
}

.header{text-align:center;margin-bottom:35px;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  box-shadow:0 16px 34px rgba(0,0,0,.28);
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
}

.badge{
  display:inline-block;
  margin:14px 0;
  background:#eaf8ff;
  color:#003b66;
  padding:10px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.8px;
}

h1{
  color:#003b66;
  font-size:56px;
  font-weight:900;
}

.description{
  color:#536172;
  font-size:19px;
  font-weight:600;
  margin-top:10px;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.top-buttons,.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  margin:30px 0;
}

button{
  border:none;
  color:white;
  padding:15px 26px;
  border-radius:16px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 12px 26px rgba(0,0,0,.20);
  transition:.3s;
}

button:hover{transform:translateY(-3px);filter:brightness(1.08);}

.save-btn,.home-btn{background:linear-gradient(135deg,#003b66,#005f99);}
.add-btn,.assurance-btn{background:linear-gradient(135deg,#00aeef,#0284c7);}
.clear-btn{background:linear-gradient(135deg,#64748b,#334155);}
.delete-btn{background:linear-gradient(135deg,#dc2626,#ef4444);}
.done-btn{background:linear-gradient(135deg,#16a34a,#22c55e);}

.form-box,.calendar-box,.records-box{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:30px;
  padding:30px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  margin-bottom:30px;
}

.section-title{
  color:#003b66;
  font-size:28px;
  font-weight:900;
  margin-bottom:22px;
  border-left:8px solid #00aeef;
  padding-left:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

label{
  display:block;
  color:#003b66;
  font-weight:900;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  padding:15px;
  border-radius:15px;
  border:1px solid #cfd8e3;
  background:#f9fbfd;
  outline:none;
  font-size:15px;
}

textarea{min-height:100px;resize:vertical;}

input:focus,select:focus,textarea:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
  background:white;
}

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:20px;
}

.month-title{
  color:#003b66;
  font-size:34px;
  font-weight:900;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid #dbeafe;
  border-radius:20px;
  overflow:hidden;
}

.day-name{
  background:linear-gradient(135deg,#003b66,#005f99);
  color:white;
  text-align:center;
  padding:14px;
  font-weight:900;
}

.day{
  min-height:140px;
  background:white;
  border:1px solid #e6eef5;
  padding:10px;
}

.day-number{
  font-weight:900;
  color:#003b66;
  margin-bottom:8px;
}

.other-month{background:#f8fafc;color:#94a3b8;}

.audit-event{
  padding:9px;
  border-radius:12px;
  color:white;
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
  line-height:1.35;
  cursor:pointer;
}

.Internal{background:linear-gradient(135deg,#003b66,#005f99);}
.External{background:linear-gradient(135deg,#7c3aed,#00aeef);}
.Completed{background:linear-gradient(135deg,#16a34a,#22c55e)!important;}
.Canceled{background:linear-gradient(135deg,#dc2626,#ef4444)!important;}

.record-card{
  background:white;
  border-left:7px solid #00aeef;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 10px 24px rgba(0,0,0,.10);
  color:#003b66;
  line-height:1.7;
}

.record-actions{
  margin-top:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.footer{
  text-align:center;
  margin-top:35px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:900px){
  body{padding:25px;}
  .container{padding:30px 20px;}
  h1{font-size:40px;}
  .calendar{grid-template-columns:1fr;}
  .day-name{display:none;}
  .day{min-height:auto;}
  button{width:100%;}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🗓️</div>
    <div class="company-label">371Q Virtual Professional Safety Office</div>
    <div class="badge">SAFETY ASSURANCE MODULE</div>
    <h1>Audit Schedule</h1>
    <div class="description">Plan, control and monitor internal and external audit dates.</div>
    <div class="title-line"></div>
  </div>

  <div class="top-buttons">
    <button class="assurance-btn" onclick="location.href='Safety-Assurance-Audit.html'">🛡️ Audits</button>
    <button class="home-btn" onclick="location.href='index.html'">🏠 Home</button>
  </div>

  <div class="form-box">
    <div class="section-title">Schedule New Audit</div>

    <div class="grid">
      <div>
        <label>Audit Title</label>
        <input id="auditTitle" placeholder="Example: Internal Audit - Stores">
      </div>

      <div>
        <label>Audit Type</label>
        <select id="auditType">
          <option value="Internal">Internal Audit</option>
          <option value="External">External Audit</option>
        </select>
      </div>

      <div>
        <label>Scheduled Date</label>
        <input id="auditDate" type="date">
      </div>

      <div>
        <label>Time</label>
        <input id="auditTime" type="time">
      </div>

      <div>
        <label>Department / Area</label>
        <input id="department" placeholder="Maintenance, QA, Stores...">
      </div>

      <div>
        <label>Responsible Person</label>
        <input id="responsible" placeholder="Auditor / Responsible person">
      </div>

      <div>
        <label>Status</label>
        <select id="status">
          <option value="Scheduled">Scheduled</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="Canceled">Canceled</option>
        </select>
      </div>

      <div>
        <label>Reference</label>
        <input id="reference" placeholder="AUD-2026-001">
      </div>
    </div>

    <label style="margin-top:18px;">Audit Scope / Notes</label>
    <textarea id="scope" placeholder="Write audit scope, objective, checklist, area, customer, authority, or notes..."></textarea>

    <div class="top-buttons">
      <button class="save-btn" onclick="saveAudit()">💾 Save Audit Schedule</button>
      <button class="clear-btn" onclick="clearForm()">🧹 Clear Form</button>
    </div>
  </div>

  <div class="calendar-box">
    <div class="calendar-header">
      <button class="home-btn" onclick="previousMonth()">‹ Previous</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="home-btn" onclick="nextMonth()">Next ›</button>
    </div>

    <div class="calendar" id="calendar"></div>
  </div>

  <div class="records-box">
    <div class="section-title">Audit Schedule Records</div>
    <div id="recordsList"></div>
  </div>

  <div class="bottom-buttons">
    <button class="home-btn" onclick="location.href='index.html'">🏠 Home</button>
    <button class="assurance-btn" onclick="location.href='Safety-Assurance-Audit.html'">🛡️ Audits</button>
    <button class="assurance-btn" onclick="location.href='Safety-Assurance.html'">Safety Assurance</button>
  </div>

  <div class="footer">371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const scheduleRef = ref(db, "auditSchedule");

let audits = [];
let currentDate = new Date();

document.getElementById("auditDate").value = new Date().toISOString().split("T")[0];

function getValue(id){
  return document.getElementById(id).value.trim();
}

window.saveAudit = function(){

  const title = getValue("auditTitle");
  const auditDate = getValue("auditDate");

  if(title === "" || auditDate === ""){
    alert("Please complete Audit Title and Scheduled Date.");
    return;
  }

  const newRef = push(scheduleRef);

  const audit = {
    id:newRef.key,
    auditTitle:title,
    auditType:getValue("auditType"),
    auditDate:auditDate,
    auditTime:getValue("auditTime"),
    department:getValue("department"),
    responsible:getValue("responsible"),
    status:getValue("status"),
    reference:getValue("reference"),
    scope:getValue("scope"),
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };

  set(newRef, audit).then(()=>{
    alert("Audit schedule saved successfully.");
    clearForm();
  });
};

window.clearForm = function(){
  document.getElementById("auditTitle").value = "";
  document.getElementById("auditType").value = "Internal";
  document.getElementById("auditDate").value = new Date().toISOString().split("T")[0];
  document.getElementById("auditTime").value = "";
  document.getElementById("department").value = "";
  document.getElementById("responsible").value = "";
  document.getElementById("status").value = "Scheduled";
  document.getElementById("reference").value = "";
  document.getElementById("scope").value = "";
};

function renderCalendar(){

  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const monthName = currentDate.toLocaleString("en-US", {month:"long", year:"numeric"});
  document.getElementById("monthTitle").innerText = monthName;

  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  days.forEach(day=>{
    const d = document.createElement("div");
    d.className = "day-name";
    d.innerText = day;
    calendar.appendChild(d);
  });

  const firstDay = new Date(year, month, 1);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - firstDay.getDay());

  for(let i=0;i<42;i++){

    const date = new Date(startDate);
    date.setDate(startDate.getDate() + i);

    const dateText = date.toISOString().split("T")[0];

    const dayBox = document.createElement("div");
    dayBox.className = "day";

    if(date.getMonth() !== month){
      dayBox.classList.add("other-month");
    }

    dayBox.innerHTML = `<div class="day-number">${date.getDate()}</div>`;

    const dayAudits = audits.filter(a => a.auditDate === dateText);

    dayAudits.forEach(a => {
      const event = document.createElement("div");

      let eventClass = a.auditType === "External" ? "External" : "Internal";

      if(a.status === "Completed") eventClass = "Completed";
      if(a.status === "Canceled") eventClass = "Canceled";

      event.className = "audit-event " + eventClass;
      event.innerHTML = `
        ${a.auditTitle || "Audit"}<br>
        ${a.auditTime || "No time"}<br>
        ${a.status || "Scheduled"}
      `;

      event.onclick = () => alert(
        "Audit: " + (a.auditTitle || "N/A") +
        "\nType: " + (a.auditType || "N/A") +
        "\nDate: " + (a.auditDate || "N/A") +
        "\nTime: " + (a.auditTime || "N/A") +
        "\nResponsible: " + (a.responsible || "N/A") +
        "\nStatus: " + (a.status || "N/A")
      );

      dayBox.appendChild(event);
    });

    calendar.appendChild(dayBox);
  }
}

function renderRecords(){

  const recordsList = document.getElementById("recordsList");
  recordsList.innerHTML = "";

  if(audits.length === 0){
    recordsList.innerHTML = `<div class="record-card">No audit schedules saved yet.</div>`;
    return;
  }

  const sorted = audits.slice().sort((a,b)=>{
    return new Date(a.auditDate || 0) - new Date(b.auditDate || 0);
  });

  sorted.forEach((a,index)=>{

    const div = document.createElement("div");
    div.className = "record-card";

    div.innerHTML = `
      <strong>${index + 1}. ${a.auditTitle || "Untitled Audit"}</strong><br>
      <strong>Type:</strong> ${a.auditType || "N/A"}<br>
      <strong>Date:</strong> ${a.auditDate || "N/A"} ${a.auditTime || ""}<br>
      <strong>Department / Area:</strong> ${a.department || "N/A"}<br>
      <strong>Responsible:</strong> ${a.responsible || "N/A"}<br>
      <strong>Status:</strong> ${a.status || "Scheduled"}<br>
      <strong>Reference:</strong> ${a.reference || "N/A"}<br>
      <strong>Scope:</strong> ${a.scope || "N/A"}<br>

      <div class="record-actions">
        <button class="done-btn" onclick="markCompleted('${a.id}')">✅ Completed</button>
        <button class="clear-btn" onclick="markInProgress('${a.id}')">🔄 In Progress</button>
        <button class="delete-btn" onclick="deleteAudit('${a.id}')">🗑 Delete</button>
      </div>
    `;

    recordsList.appendChild(div);
  });
}

window.markCompleted = function(id){
  update(ref(db, "auditSchedule/" + id), {
    status:"Completed",
    updatedAt:new Date().toISOString()
  });
};

window.markInProgress = function(id){
  update(ref(db, "auditSchedule/" + id), {
    status:"In Progress",
    updatedAt:new Date().toISOString()
  });
};

window.deleteAudit = function(id){
  if(!confirm("Are you sure you want to delete this scheduled audit?")) return;

  remove(ref(db, "auditSchedule/" + id)).then(()=>{
    alert("Audit schedule deleted successfully.");
  });
};

window.previousMonth = function(){
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
};

window.nextMonth = function(){
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
};

onValue(scheduleRef, snapshot => {

  audits = [];

  if(snapshot.exists()){
    snapshot.forEach(child => {
      audits.push({
        id:child.key,
        ...child.val()
      });
    });
  }

  renderCalendar();
  renderRecords();

});

</script>

</body>
</html>
