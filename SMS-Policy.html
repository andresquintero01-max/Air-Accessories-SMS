<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Accessories SMS Policy Documents</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1350px;
  margin:auto;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
  position:relative;
  overflow:hidden;
}

.container::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle,rgba(0,174,239,.15),transparent 70%);
  top:-170px;
  right:-120px;
}

.container::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:radial-gradient(circle,rgba(0,59,102,.14),transparent 70%);
  bottom:-150px;
  left:-120px;
}

.header,
.documents,
.bottom-buttons,
.footer{
  position:relative;
  z-index:2;
}

.header{
  text-align:center;
  margin-bottom:48px;
}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:44px;
  box-shadow:0 16px 34px rgba(0,0,0,.28);
}

.company-label{
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

.header h1{
  font-size:56px;
  color:#003b66;
  margin-bottom:12px;
  font-weight:900;
  line-height:1.1;
}

.header p{
  color:#536172;
  font-size:19px;
  font-weight:600;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.documents{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:30px;
}

.card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:28px;
  padding:32px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  transition:.35s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(0,174,239,.08);
  top:-65px;
  right:-55px;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 24px 46px rgba(0,0,0,.18);
}

.icon{
  width:78px;
  height:78px;
  border-radius:22px;
  background:linear-gradient(135deg,#003b66,#00aeef);
  color:white;
  font-size:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:22px;
  box-shadow:0 12px 26px rgba(0,0,0,.20);
  position:relative;
  z-index:2;
}

.card h2{
  color:#003b66;
  margin-bottom:14px;
  font-size:25px;
  line-height:1.25;
  font-weight:900;
  position:relative;
  z-index:2;
}

.card p{
  color:#5f6b7a;
  margin-bottom:20px;
  line-height:1.55;
  font-size:16px;
  position:relative;
  z-index:2;
}

.admin-only,
.tech-note,
.open-btn{
  position:relative;
  z-index:2;
}

.admin-only input{
  width:100%;
  padding:15px;
  border:1px solid #cfd8e3;
  border-radius:15px;
  font-size:15px;
  margin-bottom:14px;
  outline:none;
  transition:.25s;
  background:#f9fbfd;
}

.admin-only input:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
  background:white;
}

.open-btn,
.save-btn{
  width:100%;
  border:none;
  color:white;
  padding:15px;
  border-radius:15px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  margin-top:8px;
  transition:.3s;
  letter-spacing:.3px;
}

.open-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
  box-shadow:0 10px 22px rgba(0,59,102,.25);
}

.save-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  box-shadow:0 10px 22px rgba(22,163,74,.25);
}

.open-btn:hover,
.save-btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.admin-note{
  background:#ecfeff;
  color:#003b66;
  padding:14px;
  border-radius:15px;
  margin-top:14px;
  font-weight:800;
  font-size:14px;
  border-left:5px solid #00aeef;
}

.tech-note{
  background:#eff6ff;
  color:#003b66;
  padding:14px;
  border-radius:15px;
  margin-top:14px;
  font-weight:800;
  font-size:14px;
  border-left:5px solid #005f99;
}

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:50px;
  flex-wrap:wrap;
}

.nav-btn{
  border:none;
  color:white;
  padding:17px 42px;
  border-radius:16px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 12px 26px rgba(0,0,0,.20);
}

.nav-btn:hover{
  transform:translateY(-4px);
}

.back-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.home-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@media(max-width:800px){
  body{
    padding:25px;
  }

  .container{
    padding:35px 22px;
    border-radius:28px;
  }

  .header h1{
    font-size:40px;
  }

  .header p{
    font-size:16px;
  }

  .documents{
    grid-template-columns:1fr;
  }

  .nav-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">📘</div>
    <div class="company-label">AIR ACCESSORIES & AVIONICS</div>
    <h1>SMS Policy Documents</h1>
    <p>Safety Management System Documentation Portal</p>
    <div class="title-line"></div>
  </div>

  <div class="documents" id="documentsContainer"></div>

  <div class="bottom-buttons">
    <button class="nav-btn back-btn" onclick="window.location.href='index.html'">← Back</button>
    <button class="nav-btn home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
  </div>

  <div class="footer">
    371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const documentPath = "smsPolicyDocuments";

const documents = [
  ["📘","safetyManagementSystem","Safety Management System","Main SMS manual and system documentation."],
  ["👤","smsDirectorAppendix1","Assignment of SMS Director Appendix 1","SMS Director assignment and responsibility documentation."],
  ["🛡️","safetyPolicyCultureAppendix2","Safety Policy and Safety Culture, Appendix 2","Safety policy and safety culture documentation."],
  ["🚨","emergencyResponseAppendix4","Emergency Response Plan, Appendix 4","Emergency procedures and response guidance."],
  ["🔎","systemAnalysisAppendix5","System Analysis, Appendix 5","System analysis documentation and process review."],
  ["🔐","confidentialEmployeeReportAppendix6","Confidential Employee Report, Appendix 6","Confidential employee reporting documentation."],
  ["📋","mandatoryOccurrenceReportAppendix7","Mandatory Occurrence Report (MOR), Appendix 7","Mandatory occurrence reporting documentation."],
  ["🧩","investigationProcessAppendix8","Investigation Process, Appendix 8","Investigation process, methods, and guidance."]
];

let savedLinks = {};
let userRole = (localStorage.getItem("userRole") || "tech").toLowerCase();

const isAdmin =
userRole === "admin" ||
userRole === "manager" ||
userRole === "sms manager";

function renderCards(){
  const container = document.getElementById("documentsContainer");
  container.innerHTML = "";

  documents.forEach(doc => {
    const [icon,key,title,description] = doc;

    container.innerHTML += `
      <div class="card">
        <div class="icon">${icon}</div>
        <h2>${title}</h2>
        <p>${description}</p>

        <div class="admin-only">
          <input type="text" id="${key}Input" placeholder="Paste Google Drive link here">
          <button class="save-btn" onclick="saveSingleLink('${key}Input','${key}')">Save Link</button>
          <div class="admin-note">Admin view: this link is hidden from technicians.</div>
        </div>

        <button class="open-btn" onclick="openDocument('${key}')">Open Document</button>

        <div class="tech-note tech-only">
          Technician view: you can only open the approved document.
        </div>
      </div>
    `;
  });

  applyRoleAccess();
}

function applyRoleAccess(){
  if(!isAdmin){
    document.querySelectorAll(".admin-only").forEach(e => e.style.display = "none");
  }

  if(isAdmin){
    document.querySelectorAll(".tech-only").forEach(e => e.style.display = "none");
  }
}

window.openDocument = function(firebaseKey){
  const link = savedLinks[firebaseKey];

  if(!link || link.trim() === ""){
    alert("No document link is available. Please contact the administrator.");
    return;
  }

  window.open(link, "_blank");
};

window.saveSingleLink = function(inputId, firebaseKey){
  if(!isAdmin){
    alert("You are not authorized to save or edit document links.");
    return;
  }

  const link = document.getElementById(inputId).value.trim();

  if(link === ""){
    alert("Please paste a link before saving.");
    return;
  }

  set(ref(db, documentPath + "/" + firebaseKey), link)
  .then(() => {
    savedLinks[firebaseKey] = link;
    alert("Link saved successfully.");
  })
  .catch(error => {
    alert("Error saving link: " + error.message);
  });
};

function loadSavedLinks(){
  get(ref(db, documentPath))
  .then(snapshot => {
    if(snapshot.exists()){
      savedLinks = snapshot.val();

      if(isAdmin){
        documents.forEach(doc => {
          const key = doc[1];
          const input = document.getElementById(key + "Input");
          if(input) input.value = savedLinks[key] || "";
        });
      }
    }
  })
  .catch(error => console.log("Error loading links:", error));
}

renderCards();
loadSavedLinks();
</script>

</body>
</html>
