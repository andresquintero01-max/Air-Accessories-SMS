<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audit Database</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
  linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
  url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.container{
  max-width:1300px;
  margin:auto;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  padding:55px;
  border-radius:38px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
  position:relative;
  overflow:hidden;
}

.container::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle,rgba(0,174,239,.15),transparent 70%);
  top:-170px;
  right:-120px;
}

.container::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:radial-gradient(circle,rgba(0,59,102,.14),transparent 70%);
  bottom:-150px;
  left:-120px;
}

.content{position:relative;z-index:2;}

.logo{
  width:96px;
  height:96px;
  margin:0 auto 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  box-shadow:0 16px 34px rgba(0,0,0,.28);
}

.company-label{
  text-align:center;
  color:#00aeef;
  font-size:16px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

.badge{
  display:block;
  width:max-content;
  margin:0 auto 16px;
  background:#eaf8ff;
  color:#003b66;
  padding:10px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.8px;
}

h1{
  text-align:center;
  color:#003b66;
  font-size:56px;
  margin-bottom:10px;
  font-weight:900;
}

.description{
  text-align:center;
  color:#536172;
  font-size:19px;
  margin-bottom:28px;
  font-weight:600;
}

.title-line{
  width:260px;
  height:6px;
  margin:0 auto 32px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.filter-box,
.top-buttons,
.bottom-buttons{
  background:#f8fcff;
  border:1px solid #e6eef5;
  padding:22px;
  border-radius:26px;
  margin-bottom:26px;
  box-shadow:0 14px 32px rgba(0,0,0,.10);
}

.filter-title{
  font-weight:900;
  color:#003b66;
  margin-bottom:12px;
  font-size:18px;
}

.search-input,
.audit-id-input,
.edit-input{
  width:100%;
  padding:14px;
  border:1px solid #cfd8e3;
  border-radius:15px;
  font-size:15px;
  outline:none;
  background:#f9fbfd;
  color:#003b66;
  font-weight:800;
}

.search-input:focus,
.audit-id-input:focus,
.edit-input:focus{
  border-color:#00aeef;
  box-shadow:0 0 0 4px rgba(0,174,239,.14);
  background:white;
}

.filter-buttons{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-top:14px;
}

.top-buttons,
.bottom-buttons,
.actions{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.bottom-buttons{
  margin-top:40px;
  margin-bottom:0;
}

.btn{
  border:none;
  color:white;
  padding:15px 28px;
  border-radius:16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 22px rgba(0,0,0,.20);
}

.btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.audit-btn,
.home-btn,
.open-btn,
.save-btn,
.internal-btn,
.external-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.all-btn{
  background:linear-gradient(135deg,#64748b,#334155);
}

.delete-btn{
  background:linear-gradient(135deg,#dc2626,#ef4444);
  width:50px;
  height:50px;
  border-radius:50%;
  padding:0;
  font-size:20px;
}

.counter{
  text-align:center;
  color:#003b66;
  font-weight:900;
  margin-bottom:20px;
  font-size:17px;
}

.report-card{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border-radius:28px;
  padding:26px;
  margin-bottom:24px;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  transition:.25s;
  position:relative;
  overflow:hidden;
}

.report-card::before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(0,174,239,.08);
  top:-65px;
  right:-55px;
}

.report-card:hover{
  transform:translateY(-5px);
  box-shadow:0 24px 46px rgba(0,0,0,.18);
}

.card-header,
.details-grid,
.actions,
.edit-box{
  position:relative;
  z-index:2;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.event-title{
  font-size:26px;
  font-weight:900;
  color:#003b66;
  margin-bottom:6px;
}

.meta{
  color:#536172;
  font-size:15px;
  line-height:1.7;
  font-weight:600;
}

.status,
.category{
  display:inline-block;
  padding:8px 18px;
  border-radius:999px;
  color:white;
  font-size:13px;
  font-weight:900;
  margin:3px;
  border:none;
  cursor:pointer;
}

.status.open{background:linear-gradient(135deg,#003b66,#005f99);}
.status.closed{background:linear-gradient(135deg,#475569,#64748b);}
.status.in-progress{background:linear-gradient(135deg,#005f99,#00aeef);}
.status.pending-corrective-action{background:linear-gradient(135deg,#0284c7,#00aeef);}

.category.internal-audit,
.category.external-audit{
  background:linear-gradient(135deg,#003b66,#00aeef);
}

.details-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
  margin-top:18px;
}

.detail-box{
  background:#f8fcff;
  padding:15px;
  border-radius:18px;
  border:1px solid #e6eef5;
}

.detail-label{
  font-size:12px;
  color:#64748b;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:6px;
}

.detail-value{
  font-size:15px;
  color:#003b66;
  font-weight:800;
  word-break:break-word;
}

.small-note{
  font-size:12px;
  color:#64748b;
  margin-top:6px;
}

.actions{
  margin-top:22px;
  justify-content:flex-start;
}

.edit-box{
  display:none;
  margin-top:20px;
  background:#f8fcff;
  border:1px solid #e6eef5;
  border-radius:20px;
  padding:20px;
}

.edit-box label{
  color:#003b66;
  font-weight:900;
}

.edit-input{
  margin:8px 0 14px;
}

.separator-buttons{
  margin:30px 0;
  padding:18px;
  background:rgba(255,255,255,0.18);
  border-radius:24px;
  border:1px solid rgba(255,255,255,0.30);
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  backdrop-filter:blur(8px);
}

.no-data{
  text-align:center;
  color:#536172;
  font-size:20px;
  margin-top:35px;
  background:#f8fcff;
  padding:42px;
  border-radius:24px;
  border:1px solid #e6eef5;
  font-weight:800;
}

.footer{
  margin-top:35px;
  text-align:center;
  color:#003b66;
  font-size:15px;
  letter-spacing:2px;
  font-weight:900;
}

@media(max-width:700px){
  body{padding:25px;}
  .container{padding:35px 22px;}
  h1{font-size:40px;}
  .event-title{font-size:21px;}
  .btn{width:100%;}
}
</style>
</head>

<body>

<div class="container">
<div class="content">

  <div class="logo">📊</div>
  <div class="company-label">AIR ACCESSORIES & AVIONICS</div>
  <div class="badge">SAFETY ASSURANCE DATABASE</div>

  <h1>Audit Database</h1>

  <div class="description">
    Stored Internal and External Audit Reports
  </div>

  <div class="title-line"></div>

  <div class="filter-box">
    <div class="filter-title">Search Audit Reports</div>
    <input 
      id="searchInput" 
      class="search-input" 
      placeholder="Search by audit ID, title, auditor, vendor, department, date, status..."
      oninput="applyFilter()"
    >

    <div class="filter-buttons">
      <button class="btn all-btn" onclick="setCategoryFilter('All')">All Audits</button>
      <button class="btn internal-btn" onclick="setCategoryFilter('Internal Audit')">Internal Audits</button>
      <button class="btn external-btn" onclick="setCategoryFilter('External Audit')">External Audits</button>
    </div>
  </div>

  <div class="top-buttons">
    <button class="btn audit-btn" onclick="window.location.href='Safety-Assurance-Audit.html'">🛡️ Audits</button>
    <button class="btn home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
  </div>

  <div id="counter" class="counter"></div>
  <div id="auditList"></div>

  <div id="noData" class="no-data" style="display:none;">
    No audit reports found.
  </div>

  <div class="bottom-buttons">
    <button class="btn audit-btn" onclick="window.location.href='Safety-Assurance-Audit.html'">🛡️ Audits</button>
    <button class="btn home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
  </div>

  <div class="footer">
    371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
  </div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  remove,
  update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgeoQf74WZrtRLx_8cCfJSJfaRlHNl-Y0",
  authDomain: "air-accessories-sms.firebaseapp.com",
  databaseURL: "https://air-accessories-sms-default-rtdb.firebaseio.com",
  projectId: "air-accessories-sms",
  storageBucket: "air-accessories-sms.firebasestorage.app",
  messagingSenderId: "1051190584016",
  appId: "1:1051190584016:web:43da6a1b646834a21074d5"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const auditList = document.getElementById("auditList");
const noData = document.getElementById("noData");
const counter = document.getElementById("counter");

const companyId = localStorage.getItem("companyId") || "defaultCompany";
const reportsPath = "auditReports/" + companyId;

let allReports = [];
let categoryFilter = "All";

function clean(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function statusClass(status){
  return String(status || "Open").toLowerCase().replaceAll(" ","-");
}

function categoryClass(category){
  return String(category || "Internal Audit").toLowerCase().replaceAll(" ","-");
}

function renderReports(reports){

  auditList.innerHTML = "";

  if(reports.length === 0){
    noData.style.display = "block";
    counter.innerHTML = "0 audit report(s) found";
    return;
  }

  noData.style.display = "none";
  counter.innerHTML = reports.length + " audit report(s) found";

  reports.forEach((report, index) => {

    const firebaseId = report.firebaseId;
    const category = report.auditCategory || "Internal Audit";
    const title = report.title || "Untitled Audit Report";
    const auditNumber = report.auditId || report.auditNumber || firebaseId;
    const auditorName = report.auditorName || "N/A";

    const auditedEntity =
      category === "External Audit"
      ? (report.vendorName || report.serviceProvider || "N/A")
      : (report.auditedArea || report.department || "N/A");

    const date = report.date || report.auditDate || report.createdAtDisplay || report.createdAt || "N/A";
    const location = report.location || "N/A";
    const status = report.status || "Open";
    const riskPriority = report.riskPriority || "N/A";

    const card = document.createElement("div");
    card.className = "report-card";

    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="event-title">${clean(title)}</div>
          <div class="meta">
            <strong>Date:</strong> ${clean(date)}<br>
            <strong>Auditor:</strong> ${clean(auditorName)}<br>
            <strong>${category === "External Audit" ? "Vendor / Service Provider" : "Audited Area"}:</strong> ${clean(auditedEntity)}<br>
            <strong>Location:</strong> ${clean(location)}
          </div>
        </div>

        <div>
          <span class="category ${categoryClass(category)}">${clean(category)}</span>
          <button class="status ${statusClass(status)}" onclick="toggleStatus('${clean(firebaseId)}','${clean(status)}')">
            ${clean(status)}
          </button>
        </div>
      </div>

      <div class="details-grid">
        <div class="detail-box">
          <div class="detail-label">Editable Audit ID</div>
          <input class="audit-id-input" id="auditId_${clean(firebaseId)}" value="${clean(auditNumber)}">
          <div class="small-note">You can write your own audit ID here.</div>
        </div>

        <div class="detail-box">
          <div class="detail-label">Audit Category</div>
          <div class="detail-value">${clean(category)}</div>
        </div>

        <div class="detail-box">
          <div class="detail-label">Audit Type</div>
          <div class="detail-value">${clean(report.auditType || "N/A")}</div>
        </div>

        <div class="detail-box">
          <div class="detail-label">Finding Classification</div>
          <div class="detail-value">${clean(report.findingClassification || "N/A")}</div>
        </div>

        <div class="detail-box">
          <div class="detail-label">Risk / Priority</div>
          <div class="detail-value">${clean(riskPriority)}</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn open-btn" onclick="openReport('${clean(firebaseId)}', '${clean(category)}')">Open Report</button>
        <button class="btn save-btn" onclick="saveAuditId('${clean(firebaseId)}')">Save Audit ID</button>
        <button class="btn save-btn" onclick="showEdit('${clean(firebaseId)}')">Edit</button>
        <button class="btn delete-btn" onclick="deleteReport('${clean(firebaseId)}')">🗑</button>
      </div>

      <div id="edit-${clean(firebaseId)}" class="edit-box">
        <label>Title:</label>
        <input class="edit-input" id="edit-title-${clean(firebaseId)}" value="${clean(title)}">

        <label>Date:</label>
        <input class="edit-input" id="edit-date-${clean(firebaseId)}" value="${clean(date)}">

        <label>Auditor:</label>
        <input class="edit-input" id="edit-auditor-${clean(firebaseId)}" value="${clean(auditorName)}">

        <label>${category === "External Audit" ? "Vendor / Service Provider" : "Audited Area"}:</label>
        <input class="edit-input" id="edit-area-${clean(firebaseId)}" value="${clean(auditedEntity)}">

        <label>Location:</label>
        <input class="edit-input" id="edit-location-${clean(firebaseId)}" value="${clean(location)}">

        <button class="btn save-btn" onclick="saveEdit('${clean(firebaseId)}','${clean(category)}')">Save Changes</button>
      </div>
    `;

    auditList.appendChild(card);

    if((index + 1) % 3 === 0){
      const separator = document.createElement("div");
      separator.className = "separator-buttons";
      separator.innerHTML = `
        <button class="btn audit-btn" onclick="window.location.href='Safety-Assurance-Audit.html'">🛡️ Audits</button>
        <button class="btn home-btn" onclick="window.location.href='index.html'">🏠 Home</button>
      `;
      auditList.appendChild(separator);
    }
  });
}

window.setCategoryFilter = function(category){
  categoryFilter = category;
  applyFilter();
};

window.applyFilter = function(){
  const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
  let filtered = allReports;

  if(categoryFilter !== "All"){
    filtered = filtered.filter(report => (report.auditCategory || "Internal Audit") === categoryFilter);
  }

  if(searchText !== ""){
    filtered = filtered.filter(report => JSON.stringify(report).toLowerCase().includes(searchText));
  }

  renderReports(filtered);
};

const reportsRef = ref(database, reportsPath);

onValue(reportsRef, (snapshot) => {
  allReports = [];

  if(!snapshot.exists()){
    renderReports([]);
    return;
  }

  snapshot.forEach((childSnapshot) => {
    allReports.push({
      firebaseId: childSnapshot.key,
      ...childSnapshot.val()
    });
  });

  allReports.sort((a,b) => {
    const dateA = new Date(a.createdAt || a.createdAtDisplay || a.date || 0).getTime();
    const dateB = new Date(b.createdAt || b.createdAtDisplay || b.date || 0).getTime();

    if(dateB !== dateA) return dateB - dateA;

    return String(b.firebaseId).localeCompare(String(a.firebaseId));
  });

  applyFilter();
});

window.openReport = function(reportId, category){
  if(category === "External Audit"){
    window.location.href = "Safety-Assurance-External-Audit-Detail.html?id=" + reportId;
  }else{
    window.location.href = "Safety-Assurance-Internal-Audit-Detail.html?id=" + reportId;
  }
};

window.saveAuditId = function(reportId){
  const input = document.getElementById("auditId_" + reportId);
  const newAuditId = input.value.trim();

  if(newAuditId === ""){
    alert("Audit ID cannot be empty.");
    return;
  }

  update(ref(database, reportsPath + "/" + reportId), {
    auditId: newAuditId,
    updatedAt: new Date().toISOString(),
    updatedAtDisplay: new Date().toLocaleString()
  })
  .then(() => alert("Audit ID updated successfully."))
  .catch(error => alert("Error updating Audit ID: " + error.message));
};

window.toggleStatus = function(reportId, currentStatus){
  const newStatus = currentStatus === "Open" ? "Closed" : "Open";

  update(ref(database, reportsPath + "/" + reportId), {
    status: newStatus,
    updatedAt: new Date().toISOString(),
    updatedAtDisplay: new Date().toLocaleString()
  })
  .then(() => alert("Audit status changed to " + newStatus + "."))
  .catch(error => alert("Error updating status: " + error.message));
};

window.showEdit = function(reportId){
  const editBox = document.getElementById("edit-" + reportId);
  editBox.style.display = editBox.style.display === "block" ? "none" : "block";
};

window.saveEdit = function(reportId, category){
  const newTitle = document.getElementById("edit-title-" + reportId).value;
  const newDate = document.getElementById("edit-date-" + reportId).value;
  const newAuditor = document.getElementById("edit-auditor-" + reportId).value;
  const newArea = document.getElementById("edit-area-" + reportId).value;
  const newLocation = document.getElementById("edit-location-" + reportId).value;

  const data = {
    title:newTitle,
    date:newDate,
    auditorName:newAuditor,
    location:newLocation,
    updatedAt:new Date().toISOString(),
    updatedAtDisplay:new Date().toLocaleString()
  };

  if(category === "External Audit"){
    data.vendorName = newArea;
  }else{
    data.auditedArea = newArea;
  }

  update(ref(database, reportsPath + "/" + reportId), data)
  .then(() => {
    alert("Audit updated successfully.");
    location.reload();
  })
  .catch(error => alert("Error updating audit: " + error.message));
};

window.deleteReport = function(reportId){
  const confirmDelete = confirm("Are you sure you want to permanently delete this audit report?");
  if(!confirmDelete) return;

  remove(ref(database, reportsPath + "/" + reportId))
  .then(() => alert("Audit Report deleted successfully."))
  .catch(error => alert("Error deleting report: " + error.message));
};

</script>

</body>
</html>
