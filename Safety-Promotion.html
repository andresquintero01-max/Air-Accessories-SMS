<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Accessories Safety Promotion</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(0,174,239,.25), transparent 30%),
    radial-gradient(circle at bottom right, rgba(0,59,102,.35), transparent 35%),
    linear-gradient(rgba(2,23,48,.88), rgba(2,23,48,.94)),
    url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:40px;
}

.main-container{
  max-width:1050px;
  margin:auto;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  border-radius:38px;
  padding:55px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);
  position:relative;
  overflow:hidden;
  animation:fadeIn .8s ease;
}

.main-container::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle,rgba(0,174,239,.16),transparent 70%);
  top:-170px;
  right:-120px;
}

.main-container::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:radial-gradient(circle,rgba(0,59,102,.14),transparent 70%);
  bottom:-150px;
  left:-120px;
}

.content{position:relative;z-index:2;}

.header{
  text-align:center;
  margin-bottom:48px;
}

.logo{
  width:100px;
  height:100px;
  margin:0 auto 20px;
  border-radius:30px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:46px;
  box-shadow:0 18px 40px rgba(0,0,0,.30);
}

.company{
  color:#00aeef;
  font-size:15px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  background:#ecfeff;
  color:#003b66;
  padding:10px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.8px;
  margin-bottom:16px;
}

h1{
  font-size:56px;
  color:#003b66;
  margin-bottom:12px;
  font-weight:900;
  line-height:1.1;
}

.subtitle{
  color:#536172;
  font-size:19px;
  font-weight:600;
}

.title-line{
  width:260px;
  height:6px;
  margin:25px auto 0;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#00aeef,#003b66,transparent);
}

.buttons-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:30px;
}

.main-btn{
  background:linear-gradient(135deg,#ffffff,#f8fcff);
  border:none;
  border-radius:28px;
  padding:32px;
  border:1px solid #e6eef5;
  border-top:9px solid #00aeef;
  box-shadow:0 14px 30px rgba(0,0,0,.11);
  transition:.35s;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  text-align:left;
  min-height:320px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.main-btn::before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(0,174,239,.09);
  top:-65px;
  right:-55px;
}

.main-btn:nth-child(2){
  border-top-color:#005f99;
}

.main-btn:nth-child(2)::before{
  background:rgba(0,59,102,.09);
}

.main-btn:hover{
  transform:translateY(-8px);
  box-shadow:0 24px 46px rgba(0,0,0,.18);
}

.icon{
  width:78px;
  height:78px;
  border-radius:22px;
  color:white;
  font-size:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:22px;
  box-shadow:0 12px 26px rgba(0,0,0,.20);
  position:relative;
  z-index:2;
}

.main-btn:nth-child(1) .icon{
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
}

.main-btn:nth-child(2) .icon{
  background:linear-gradient(135deg,#005f99,#00aeef);
}

.info{
  position:relative;
  z-index:2;
}

.info h2{
  color:#003b66;
  margin-bottom:14px;
  font-size:30px;
  line-height:1.25;
  font-weight:900;
}

.info p{
  color:#536172;
  margin-bottom:25px;
  line-height:1.55;
  font-size:16px;
  font-weight:600;
}

.open-label{
  position:relative;
  z-index:2;
  width:100%;
  display:block;
  text-align:center;
  color:white;
  padding:16px;
  border-radius:15px;
  font-size:16px;
  font-weight:900;
  transition:.3s;
  letter-spacing:.3px;
  background:linear-gradient(135deg,#003b66,#005f99,#00aeef);
  box-shadow:0 12px 26px rgba(0,0,0,.20);
}

.main-btn:nth-child(2) .open-label{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.main-btn:hover .open-label{
  transform:translateY(-3px);
  filter:brightness(1.08);
}

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  margin-top:50px;
}

.nav-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-decoration:none;
  border:none;
  color:white;
  padding:17px 50px;
  border-radius:16px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 12px 26px rgba(0,0,0,.20);
}

.home-btn{
  background:linear-gradient(135deg,#003b66,#005f99);
}

.dashboard-btn{
  background:linear-gradient(135deg,#00aeef,#0284c7);
}

.nav-btn:hover{
  transform:translateY(-4px);
  filter:brightness(1.08);
}

.footer{
  text-align:center;
  margin-top:38px;
  color:#003b66;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:800px){
  body{padding:25px;}
  .main-container{padding:35px 22px;border-radius:28px;}
  h1{font-size:40px;}
  .subtitle{font-size:16px;}
  .buttons-container{grid-template-columns:1fr;}
  .nav-btn{width:100%;}
}
</style>
</head>

<body>

<div class="main-container">
<div class="content">

  <div class="header">
    <div class="logo">🎓</div>
    <div class="company">AIR ACCESSORIES & AVIONICS</div>
    <div class="badge">SAFETY PROMOTION</div>

    <h1>Safety Promotion</h1>

    <div class="subtitle">
      Training and Safety Promotion Modules
    </div>

    <div class="title-line"></div>
  </div>

  <div class="buttons-container">

    <button class="main-btn" onclick="window.location.href='Safety-Promotion-Training.html'">
      <div>
        <div class="icon">📚</div>

        <div class="info">
          <h2>Training</h2>
          <p>
            Access SMS training, aviation safety courses, employee quizzes and operational guidance.
          </p>
        </div>
      </div>

      <div class="open-label">
        Open Training
      </div>
    </button>

    <button class="main-btn" onclick="window.location.href='Safety-Promotion-Culture.html'">
      <div>
        <div class="icon">👥</div>

        <div class="info">
          <h2>Safety Culture</h2>
          <p>
            Promote safety awareness, communication, bulletins, alerts and positive reporting culture.
          </p>
        </div>
      </div>

      <div class="open-label">
        Open Safety Culture
      </div>
    </button>

  </div>

  <div class="bottom-buttons">
    <button class="nav-btn home-btn" onclick="window.location.href='index.html'">
      🏠 Home
    </button>

    <button class="nav-btn dashboard-btn" onclick="window.location.href='Dashboard.html'">
      📊 Dashboard
    </button>
  </div>

  <div class="footer">
    371Q SMS SOFTWARE — YOUR ACCIDENT PREVENTION TOOL
  </div>

</div>
</div>

</body>
</html>
